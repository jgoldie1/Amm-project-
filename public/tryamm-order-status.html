<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>TRYAMM — My Order Status</title>
<style>:root{font:18px/1.55 system-ui,sans-serif;color-scheme:dark;background:#120d21;color:white}body{max-width:780px;margin:auto;padding:1.2rem}header,section{background:#252038;border:1px solid #695682;border-radius:14px;padding:1.2rem;margin:1rem 0}h1{font-size:clamp(2rem,6vw,3rem)}a{color:#d8c5ff}.stage{padding:.9rem;border-left:4px solid #ae8fff;margin:1rem 0;background:#332b4b}button{font:inherit;padding:.8rem 1.2rem;min-height:48px;border-radius:9px;background:#c3b2f8;color:#140f29;border:0;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:2px}#status{overflow-wrap:anywhere}</style></head><body>
<header><a href="/tryamm-website-os.html">TRYAMM Website OS</a><h1>Track your website order</h1><p>A private, read-only view of your quote, payment verification and delivery stage.</p></header>
<section><h2>Your current order</h2><p id="status" role="status" aria-live="polite">Checking your private tracking link…</p><div id="details"></div><button id="refresh" type="button" disabled>Refresh order status</button><p><small>Never enter a card number here. The order tracker does not collect payment or change orders.</small></p></section>
<script>
'use strict';
const $=id=>document.getElementById(id);
const token=(new URLSearchParams(location.hash.replace(/^#/,''))).get('token')||'';
if(token)history.replaceState(null,'',location.pathname);
function add(parent,title,content){const item=document.createElement('div');item.className='stage';const head=document.createElement('strong');head.textContent=title;const text=document.createElement('p');text.textContent=content;item.append(head,text);parent.append(item)}
async function refresh(){
 if(!/^[a-f0-9]{64}$/.test(token)){$('status').textContent='Invalid tracking link. Request a fresh link from the business.';return}
 try{
  const res=await fetch('/api/website-os/customer-tracking/lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store',referrerPolicy:'no-referrer'});
  const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Tracking unavailable');
  const order=data.order,root=$('details');root.replaceChildren();
  $('status').textContent='Order status: '+order.status;
  add(root,'Website package',order.packageId+' — '+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(order.priceCents/100));
  add(root,'Agreed work',order.description);
  add(root,'Payment',data.paymentVerified?'Verified by TRYAMM database':'Not verified by TRYAMM database');
  add(root,'Website review',data.previewApproved?'Customer approved preview':'Preview approval pending or changes requested');
  if(data.reviewNotes)add(root,'Latest review notes',data.reviewNotes);
  add(root,'Delivery',data.deliveryVerified?'Recorded as delivered':'Not yet recorded as delivered');
  $('refresh').disabled=false;
 }catch(error){$('status').textContent=error.message;$('refresh').disabled=true}
}
$('refresh').onclick=refresh;refresh();
</script></body></html>
