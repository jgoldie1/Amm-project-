<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gameverse Production Control | Stubbs AI</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/brand/favicon.ico"><link rel="stylesheet" href="/brand.css"><style>body{margin:0;background:#030712;color:#eef6ff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1240px;margin:auto;padding:24px}.hero,.panel{background:linear-gradient(145deg,#09152b,#130b2b);border:1px solid #274f78;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0008}.hero{display:flex;gap:20px;align-items:center}.logo{width:96px;height:96px;border-radius:24px;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}.card{background:#07101f;border:1px solid #254562;border-radius:16px;padding:16px}.count{font-size:2rem;font-weight:800}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button,input,select,textarea{font:inherit;border-radius:10px;border:1px solid #31557c;background:#081425;color:#fff;padding:11px}button{cursor:pointer;background:linear-gradient(90deg,#1267e8,#7a31db);font-weight:700}textarea{min-height:90px;width:100%;box-sizing:border-box}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.wide{grid-column:1/-1}.item{border-left:4px solid #28c6ff}.status{font-size:.8rem;padding:4px 8px;border:1px solid #44708f;border-radius:999px}.muted{color:#a8bdd0}@media(max-width:600px){.hero{align-items:flex-start}.logo{width:72px;height:72px}}</style></head><body><main class="wrap"><section class="hero"><img class="logo" src="/brand/stubbs-ai-rounded-512.png" alt="Stubbs AI Lion of Judah crest"><div><h1>Gameverse Production Control</h1><p class="muted">Stubbs AI · Powered by Lyons Tech AI</p><p>Manage original 3D assets, animation, NPC intelligence, quests, audio, multiplayer, performance, QA and balancing for all 11 games.</p></div></section><div class="toolbar"><a href="/game-launcher.html"><button>Open Game Launcher</button></a><button id="refresh">Refresh</button><button id="seed">Seed Production Plan</button></div><section id="summary" class="grid"></section><section class="panel"><h2>Add production item</h2><div class="form"><select id="category"><option value="character">3D Character</option><option value="environment">Environment</option><option value="animation">Animation</option><option value="npc-tree">NPC Behavior Tree</option><option value="quest">Quest</option><option value="audio">Soundtrack / Voice / SFX</option><option value="server">Multiplayer Infrastructure</option><option value="performance">Performance</option><option value="qa">QA</option><option value="balance">Balancing</option></select><input id="gameId" value="shared" placeholder="Game ID"><input id="title" placeholder="Title"><select id="priority"><option>medium</option><option>high</option><option>critical</option><option>low</option></select><textarea id="description" class="wide" placeholder="Requirements and acceptance criteria"></textarea><input id="adminKey" type="password" placeholder="Admin key"><button id="add">Add item</button></div></section><section class="panel" style="margin-top:18px"><h2>Production board</h2><div id="items" class="grid"></div></section></main><script src="/brand.js"></script><script src="/dist/game-production.js"></script></body></html>
