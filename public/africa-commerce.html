<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryAMM Africa Commerce</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:1000px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{padding:18px;border:1px solid #5ff3ff55;border-radius:18px;background:#07141ddd}label{display:block;margin:10px 0 4px}input,select,button{width:100%;padding:12px;border-radius:12px}pre{white-space:pre-wrap;overflow:auto}.muted{opacity:.75}</style></head><body><main><h1>Africa Commerce Command Center</h1><p class="muted">Nigeria-first checkout, wallet, payouts, and low-bandwidth commerce controls.</p><div class="grid"><section class="card"><h2>Market Experience</h2><label>Country</label><select id="country"><option value="NG">Nigeria</option><option value="GH">Ghana</option><option value="KE">Kenya</option><option value="ZA">South Africa</option></select><button id="loadMarket">Load market</button><pre id="marketOut"></pre></section><section class="card"><h2>Create Checkout</h2><label>Supabase access token</label><input id="token" type="password" placeholder="Paste signed-in access token"><label>Email</label><input id="email" type="email"><label>Amount</label><input id="amount" type="number" min="1" step="0.01"><label>Channel</label><select id="channel"><option>card</option><option>bank</option><option>bank_transfer</option><option>ussd</option><option>mobile_money</option></select><button id="checkout">Create localized checkout</button><pre id="checkoutOut"></pre></section><section class="card"><h2>Wallet</h2><button id="wallet">Load wallet</button><button id="ledger">Load ledger</button><pre id="walletOut"></pre></section><section class="card"><h2>Creator settlement preview</h2><label>Gross amount</label><input id="gross" type="number" min="1" step="0.01"><label>Platform rate</label><input id="platformRate" type="number" min="0" max="0.5" step="0.01" value="0.10"><button id="settlement">Preview payout</button><pre id="settlementOut"></pre></section></div></main><script src="/africa-commerce.js"></script></body></html>
