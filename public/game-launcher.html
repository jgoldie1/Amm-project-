<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryAMM Gameverse | Stubbs AI</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/brand.css"><style>body{margin:0;background:#050816;color:#eef6ff;font-family:system-ui,sans-serif}.shell{max-width:1200px;margin:auto;padding:20px}.hero,.panel,.game{background:linear-gradient(145deg,#0a1330,#111a3d);border:1px solid #314b8c;border-radius:18px;padding:18px;box-shadow:0 0 30px #2357ff22}.hero{display:flex;gap:16px;align-items:center}.hero img{width:92px;height:92px;border-radius:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,select,input{background:#111b3b;color:#fff;border:1px solid #4e73d9;border-radius:12px;padding:12px;font:inherit}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.game h3{margin:0 0 8px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#23366a;margin:3px;font-size:.8rem}.columns{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:16px}.list{max-height:360px;overflow:auto}.status{min-height:24px;color:#93f7ff}@media(max-width:760px){.columns{grid-template-columns:1fr}.hero{align-items:flex-start}.hero img{width:72px;height:72px}}</style></head><body><main class="shell"><section class="hero"><img src="/brand/stubbs-ai-rounded-512.png" onerror="this.src='/brand/stubbs-ai-fallback.svg'" alt="Stubbs AI Lion of Judah crest"><div><h1>TryAMM Gameverse</h1><p>11 connected games · Stubbs AI · Powered by Lyons Tech AI</p><div id="status" class="status">Loading player dashboard…</div></div></section><section class="toolbar"><input id="player" value="demo-player" aria-label="Player ID"><select id="filter"><option value="all">All games</option><option value="prototype">Prototype</option><option value="design">Design</option></select><button id="refresh">Refresh</button><button id="queueYogi">Queue Yogihoo</button><button id="streetverse">Enter Creator City</button></section><section id="games" class="grid"></section><section class="columns"><div class="panel"><h2>Player Dashboard</h2><div id="dashboard"></div></div><div class="panel"><h2>Top Leaderboard</h2><div id="leaders" class="list"></div></div></section></main><script src="/brand.js"></script><script src="/dist/game-launcher.js"></script></body></html>
