<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameVerse Playable Slice</title><style>body{font-family:system-ui;background:#0b1020;color:#fff;margin:0}main{max-width:900px;margin:auto;padding:20px}canvas{width:100%;background:#111827;border:1px solid #475569;border-radius:14px;touch-action:none}button,input{padding:10px 14px;margin:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.high{filter:contrast(1.5)}.reduced *{scroll-behavior:auto!important;animation:none!important;transition:none!important}</style></head><body><main><h1>GameVerse Playable Vertical Slice</h1><p>Move with arrows/WASD or touch. Collect 10 energy orbs before the AI hunter catches you.</p><div class="row"><input id="name" aria-label="Player name" placeholder="Player name"><button id="saveProfile">Save Profile</button><button id="match">Find Match</button><label><input type="checkbox" id="contrast"> High contrast</label><label><input type="checkbox" id="motion"> Reduced motion</label></div><p id="profile" aria-live="polite"></p><canvas id="g" width="800" height="450" aria-label="Game area"></canvas><div><button id="restart">Restart</button><span id="status" aria-live="polite"></span></div></main><script src="/socket.io/socket.io.js"></script><script>const c=document.getElementById('g'),x=c.getContext('2d'),S=document.getElementById('status'),P=document.getElementById('profile');const playerId=localStorage.gvPlayerId||(localStorage.gvPlayerId=crypto.randomUUID());const socket=window.io?io():null;let p,e,orbs,score,best=+localStorage.gvBest||0,keys={},ended=false,matchId=null,peer=null;async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error((await r.json()).error||'Request failed');return r.json()}async function loadProfile(){try{const v=await api('/api/gameverse/profile/'+playerId);P.textContent=`${v.displayName} • Level ${v.level} • XP ${v.xp} • Wins ${v.wins}`;document.getElementById('name').value=v.displayName;document.getElementById('contrast').checked=!!v.accessibility.highContrast;document.getElementById('motion').checked=!!v.accessibility.reducedMotion;applyA11y()}catch{await saveProfile()}}async function saveProfile(){const accessibility={highContrast:document.getElementById('contrast').checked,reducedMotion:document.getElementById('motion').checked,audioCues:true};const v=await api('/api/gameverse/profile',{playerId,displayName:document.getElementById('name').value||'Player',accessibility});P.textContent=`${v.displayName} • Level ${v.level} • XP ${v.xp} • Wins ${v.wins}`;applyA11y()}function applyA11y(){document.body.classList.toggle('high',document.getElementById('contrast').checked);document.body.classList.toggle('reduced',document.getElementById('motion').checked)}async function record(won){try{const r=await api('/api/gameverse/result',{playerId,score,won,matchId});if(r.accepted){P.textContent=`${r.profile.displayName} • Level ${r.profile.level} • XP ${r.profile.xp} • Wins ${r.profile.wins}`}}catch{}}function reset(){ended=false;p={x:80,y:220,r:14,s:4};e={x:700,y:220,r:16,s:1.35};orbs=Array.from({length:10},()=>({x:120+Math.random()*620,y:40+Math.random()*370,r:7}));score=0;S.textContent=' Score 0 | Best '+best;loop()}addEventListener('keydown',ev=>keys[ev.key.toLowerCase()]=1);addEventListener('keyup',ev=>keys[ev.key.toLowerCase()]=0);c.addEventListener('pointerdown',ev=>{const r=c.getBoundingClientRect();p.tx=(ev.clientX-r.left)*c.width/r.width;p.ty=(ev.clientY-r.top)*c.height/r.height});function finish(won,msg){if(ended)return false;ended=true;best=Math.max(best,score);localStorage.gvBest=best;S.textContent=msg+' | Score '+score+' | Best '+best;record(won);return false}function step(){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(p.tx!=null){dx=p.tx-p.x;dy=p.ty-p.y;if(Math.hypot(dx,dy)<8){delete p.tx;delete p.ty;dx=dy=0}}let m=Math.hypot(dx,dy)||1;p.x=Math.max(15,Math.min(785,p.x+dx/m*p.s));p.y=Math.max(15,Math.min(435,p.y+dy/m*p.s));if(socket&&matchId)socket.emit('gameverse:state',{x:p.x,y:p.y});dx=p.x-e.x;dy=p.y-e.y;m=Math.hypot(dx,dy)||1;e.x+=dx/m*e.s;e.y+=dy/m*e.s;orbs=orbs.filter(o=>{if(Math.hypot(p.x-o.x,p.y-o.y)<p.r+o.r){score++;S.textContent=' Score '+score+' | Best '+best;return false}return true});if(!orbs.length)return finish(true,'You win — AI hunter defeated');if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r)return finish(false,'Caught by AI hunter');return true}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#22d3ee';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.fillStyle='#ef4444';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#facc15';orbs.forEach(o=>{x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()});if(peer){x.fillStyle='#a78bfa';x.beginPath();x.arc(peer.x,peer.y,12,0,7);x.fill()}}let running=false;function loop(){if(running)return;running=true;(function f(){draw();if(step())requestAnimationFrame(f);else running=false})()}document.getElementById('restart').addEventListener('click',()=>{running=false;reset()});document.getElementById('saveProfile').addEventListener('click',saveProfile);document.getElementById('contrast').addEventListener('change',saveProfile);document.getElementById('motion').addEventListener('change',saveProfile);document.getElementById('match').addEventListener('click',async()=>{try{const r=await api('/api/gameverse/matchmaking',{playerId,gameId:'playable-slice',mode:'duel'});S.textContent=r.status==='queued'?'Waiting for another player...':'Match ready';if(r.match){matchId=r.match.id;socket?.emit('gameverse:join',{matchId,playerId})}}catch(e){S.textContent=e.message}});socket?.on('gameverse:state',v=>{peer={x:v.x,y:v.y}});socket?.on('gameverse:peer',v=>{S.textContent=v.connected?'Opponent connected':'Opponent disconnected'});loadProfile();reset();</script></body></html>
