<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>GameVerse Playable Slice</title><style>body{font-family:system-ui;background:#0b1020;color:#fff;margin:0}main{max-width:900px;margin:auto;padding:20px}canvas{width:100%;background:#111827;border:1px solid #475569;border-radius:14px;touch-action:none}button{padding:10px 14px;margin:4px}</style></head><body><main><h1>GameVerse Playable Vertical Slice</h1><p>Move with arrows/WASD or touch. Collect 10 energy orbs before the AI hunter catches you.</p><canvas id='g' width='800' height='450'></canvas><div><button id='restart'>Restart</button><span id='status'></span></div></main><script>const c=document.getElementById('g'),x=c.getContext('2d'),S=document.getElementById('status');let p,e,orbs,score,best=+localStorage.gvBest||0,keys={};function reset(){p={x:80,y:220,r:14,s:4};e={x:700,y:220,r:16,s:1.35};orbs=Array.from({length:10},(_,i)=>({x:120+Math.random()*620,y:40+Math.random()*370,r:7}));score=0;S.textContent=' Score 0 | Best '+best;loop()}addEventListener('keydown',ev=>keys[ev.key.toLowerCase()]=1);addEventListener('keyup',ev=>keys[ev.key.toLowerCase()]=0);c.addEventListener('pointerdown',ev=>{const r=c.getBoundingClientRect();p.tx=(ev.clientX-r.left)*c.width/r.width;p.ty=(ev.clientY-r.top)*c.height/r.height});function step(){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(p.tx!=null){dx=p.tx-p.x;dy=p.ty-p.y;if(Math.hypot(dx,dy)<8){delete p.tx;delete p.ty;dx=dy=0}}let m=Math.hypot(dx,dy)||1;p.x=Math.max(15,Math.min(785,p.x+dx/m*p.s));p.y=Math.max(15,Math.min(435,p.y+dy/m*p.s));dx=p.x-e.x;dy=p.y-e.y;m=Math.hypot(dx,dy)||1;e.x+=dx/m*e.s;e.y+=dy/m*e.s;orbs=orbs.filter(o=>{if(Math.hypot(p.x-o.x,p.y-o.y)<p.r+o.r){score++;S.textContent=' Score '+score+' | Best '+best;return false}return true});if(!orbs.length){best=Math.max(best,score);localStorage.gvBest=best;alert('You win! AI hunter defeated.');return false}if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){best=Math.max(best,score);localStorage.gvBest=best;alert('Caught by the AI hunter. Score '+score);return false}return true}function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#22d3ee';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.fillStyle='#ef4444';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#facc15';orbs.forEach(o=>{x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()})}let running=false;function loop(){if(running)return;running=true;(function f(){draw();if(step())requestAnimationFrame(f);else running=false})()}document.getElementById('restart').onclick=()=>{running=false;reset()};reset();</script></body></html>
