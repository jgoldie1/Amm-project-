<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TryAMM Publishing Workstation</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:20px}input,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:6px 0}textarea{min-height:220px}section{border:1px solid #ccc;border-radius:12px;padding:14px;margin:14px 0}</style></head><body><h1>TryAMM Publishing Workstation</h1><p>Create manuscript metadata and export a submission checklist for Amazon KDP, IngramSpark or Lulu. Final upload/account approval stays with the publisher platform.</p><section><input id='title' placeholder='Book title'><input id='author' placeholder='Author'><input id='isbn' placeholder='ISBN (optional)'><textarea id='manuscript' placeholder='Paste manuscript or chapter draft'></textarea><button id='save'>Save draft locally</button><button id='export'>Export submission checklist</button></section><pre id='out'></pre><script>const key='tryammBookDraft';let d=JSON.parse(localStorage.getItem(key)||'{}');title.value=d.title||'';author.value=d.author||'';isbn.value=d.isbn||'';manuscript.value=d.manuscript||'';save.onclick=()=>{localStorage.setItem(key,JSON.stringify({title:title.value,author:author.value,isbn:isbn.value,manuscript:manuscript.value}));alert('Draft saved locally')};export.onclick=()=>{out.textContent=`TRYAMM PUBLISHING CHECKLIST\nTitle: ${title.value}\nAuthor: ${author.value}\nISBN: ${isbn.value||'Publisher-assigned or TBD'}\n\nKDP: manuscript formatted, cover sized, metadata, categories/keywords, pricing, rights/AI disclosure, proof review.\nIngramSpark: print-ready PDF, cover template, ISBN/distribution settings, wholesale discount/returns decision.\nLulu: print format, interior PDF, cover, pricing, distribution eligibility.\n\nRights: verify copyright, samples/images/quotes, AI disclosures, contributor agreements before upload.`}</script></body></html>
