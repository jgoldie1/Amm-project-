<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryAMM Living Worlds</title><style>html,body{margin:0;background:#080b16;color:#fff;font-family:system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;background:#11182a}a{color:#67f6df}main{position:relative;height:calc(100vh - 64px)}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:1rem;left:1rem;max-width:28rem;background:#0d1424e8;border:1px solid #2bdac0;border-radius:14px;padding:1rem}.controls{display:grid;grid-template-columns:repeat(3,3.2rem);gap:.35rem;margin-top:.7rem}.controls button{min-height:3rem;font-size:1.15rem}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.prompt{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#000d;padding:.8rem 1rem;border-radius:999px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header><strong>AMM Omniverse · Living Worlds</strong><a href="/">Return to TryAMM</a></header><main><canvas id="worldCanvas" aria-label="Interactive Living World"></canvas><section class="hud" aria-label="World controls"><strong id="worldStatus">Loading world…</strong><p>Move with W/A/S/D, arrow keys, or the large buttons. Enter a glowing portal and press Enter.</p><div class="controls"><button class="up" data-key="w" aria-label="Move forward">▲</button><button class="left" data-key="a" aria-label="Move left">◀</button><button class="down" data-key="s" aria-label="Move backward">▼</button><button class="right" data-key="d" aria-label="Move right">▶</button></div></section><div id="portalPrompt" class="prompt" hidden>Press Enter to travel through portal</div><div id="worldAnnounce" class="sr-only" role="status" aria-live="polite"></div></main><script type="module">import{bootLivingWorlds}from'/living-worlds-runtime.js';for(const b of document.querySelectorAll('[data-key]')){const key=b.dataset.key;b.addEventListener('pointerdown',()=>dispatchEvent(new KeyboardEvent('keydown',{key})));for(const evt of['pointerup','pointercancel','pointerleave'])b.addEventListener(evt,()=>dispatchEvent(new KeyboardEvent('keyup',{key})))}bootLivingWorlds().catch(e=>{document.querySelector('#worldStatus').textContent=e.message})</script></body></html>
