<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Googolplex Memory Control Center</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:1100px;margin:auto;padding:24px}.panel{background:#07111f;border:1px solid #1b7795;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}input,textarea,select{width:100%;padding:12px;margin:6px 0;background:#02070d;color:#e9fbff;border:1px solid #245d70;border-radius:10px}button,a.button{padding:11px 14px;border-radius:10px;border:1px solid #44d7ff;background:#0b2d3b;color:white;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}.memory{border:1px solid #245d70;border-radius:12px;padding:12px;margin:10px 0}.meta{font-size:.85rem;opacity:.75}.warning{color:#ffd28d}</style></head><body><main><header><p class="eyebrow">TryAMM Intelligence</p><h1>Googolplex Memory Control Center</h1><p>View, create, search, revise, export, expire, and forget your authenticated AI memories.</p><a class="button" href="/">Back to HoloGPT</a></header><section class="panel"><h2>Connection</h2><p id="status">Checking memory service…</p><label>Supabase access token<input id="token" type="password" autocomplete="off" placeholder="Paste your signed-in access token"></label><button id="saveToken">Use token on this device</button><button id="refresh">Refresh memories</button><button id="export">Export my memories</button><button id="cleanup">Run retention cleanup</button></section><section class="panel"><h2>Create memory</h2><div class="grid"><label>Title<input id="title" placeholder="Project decision"></label><label>Tier<select id="tier"><option>working</option><option>episodic</option><option>semantic</option><option>procedural</option><option>relational</option><option>project</option><option>npc</option><option>arena</option><option>commerce</option></select></label><label>Visibility<select id="visibility"><option>private</option><option>shared</option><option>public</option></select></label><label>Expires<input id="expires" type="datetime-local"></label></div><label>Content<textarea id="content" rows="5" placeholder="What should AMM Intelligence remember?"></textarea></label><label>Facts, one per line<textarea id="facts" rows="3"></textarea></label><label>Tags, comma separated<input id="tags"></label><label><input id="consent" type="checkbox" style="width:auto"> I consent to storing this memory for the selected purpose.</label><button id="create">Create memory</button><p id="createResult"></p></section><section class="panel"><h2>Search and filters</h2><div class="grid"><input id="search" placeholder="Search memory"><select id="filterTier"><option value="">All tiers</option><option>working</option><option>episodic</option><option>semantic</option><option>procedural</option><option>relational</option><option>project</option><option>npc</option><option>arena</option><option>commerce</option></select></div><button id="runSearch">Search</button></section><section class="panel"><h2>My memories</h2><div id="memories"></div></section><section class="panel"><h2>Audit history</h2><button id="audit">Load audit log</button><pre id="auditLog"></pre></section></main><script src="/memory-control.js"></script></body></html>
