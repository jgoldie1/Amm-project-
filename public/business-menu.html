<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TryAMM Business Menu</title>
<style>
body{font-family:system-ui;background:#050814;color:#fff;margin:0;padding:24px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#0b1324;border:1px solid #263d69;border-radius:18px;padding:16px}.price{font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:10px 14px;border-radius:999px;border:1px solid #263d69;background:#101b38;color:#fff}.coupon{padding:12px;border:1px dashed #ffd76e;border-radius:12px;margin:10px 0}</style>
</head>
<body>
<main>
<h1>Business Menu & Storefront</h1>
<p>One surface for restaurant menus, retail items, services, pickup, delivery, promo codes, and Holo Coupons.</p>
<div id="offers" class="coupon">No active Holo Coupon selected.</div>
<div class="grid" id="menuGrid">
  <section class="card"><h2>Signature Meal</h2><p>Example restaurant item.</p><p class="price">$14.99</p><div class="actions"><button type="button">Add to Order</button><button type="button">View in Holo Menu</button></div></section>
  <section class="card"><h2>Featured Product</h2><p>Example storefront product.</p><p class="price">$29.00</p><div class="actions"><button type="button">Add to Cart</button><button type="button">View in Holo Menu</button></div></section>
</div>
</main>
</body>
</html>
