<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TryAMM — Create, Stream, Play, Shop & Connect</title>
  <meta name="description" content="TryAMM is a creator, streaming, gaming, marketplace and community platform built for discovery, participation and accessible digital experiences." />
  <link rel="canonical" href="https://tryamm.online/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TryAMM" />
  <meta property="og:title" content="TryAMM — Create, Stream, Play, Shop & Connect" />
  <meta property="og:description" content="Discover creators, live experiences, games, music, podcasts, products and more on TryAMM." />
  <meta property="og:url" content="https://tryamm.online/" />
  <meta property="og:image" content="https://tryamm.online/og-default.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TryAMM — Create, Stream, Play, Shop & Connect" />
  <meta name="twitter:description" content="Discover creators, live experiences, games, music, podcasts, products and more on TryAMM." />
  <meta name="twitter:image" content="https://tryamm.online/og-default.jpg" />

  <script type="application/ld+json" id="organization-jsonld">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://tryamm.online/#organization",
        "name": "TryAMM",
        "url": "https://tryamm.online/"
      },
      {
        "@type": "WebSite",
        "@id": "https://tryamm.online/#website",
        "url": "https://tryamm.online/",
        "name": "TryAMM",
        "publisher": { "@id": "https://tryamm.online/#organization" }
      }
    ]
  }
  </script>
</head>
<body>
  <main>
    <h1>TryAMM</h1>
    <p>Create, stream, play, shop and connect.</p>

    <nav id="official-social-links" aria-label="Official TryAMM social profiles" hidden>
      <strong>Follow TryAMM:</strong>
      <a data-social="facebook" rel="me noopener noreferrer" target="_blank">Facebook</a>
      <a data-social="instagram" rel="me noopener noreferrer" target="_blank">Instagram</a>
      <a data-social="tiktok" rel="me noopener noreferrer" target="_blank">TikTok</a>
    </nav>

    <section aria-label="Share TryAMM">
      <button type="button" id="share-facebook">Share on Facebook</button>
      <button type="button" data-copy-campaign="instagram">Copy Instagram campaign link</button>
      <button type="button" data-copy-campaign="tiktok">Copy TikTok campaign link</button>
      <p id="share-status" role="status" aria-live="polite"></p>
    </section>

    <button onclick="increment()">Tap</button>
    <p id="count">0</p>
  </main>

  <script>
  async function load() {
    try {
      const res = await fetch('/count');
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById('count').innerText = data.count;
    } catch (_) {}
  }

  async function increment() {
    try {
      await fetch('/increment', { method: 'POST' });
      load();
    } catch (_) {}
  }

  function campaignUrl(source) {
    const url = new URL(window.location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('utm_source', source);
    url.searchParams.set('utm_medium', 'social');
    url.searchParams.set('utm_campaign', 'tryamm_launch');
    return url.toString();
  }

  async function configureSocialLinks() {
    try {
      const res = await fetch('/api/social-links');
      if (!res.ok) return;
      const links = await res.json();
      const nav = document.getElementById('official-social-links');
      let visible = 0;
      Object.entries(links).forEach(([name, url]) => {
        const anchor = nav.querySelector(`[data-social="${name}"]`);
        if (anchor && typeof url === 'string' && url.startsWith('https://')) {
          anchor.href = url;
          anchor.hidden = false;
          visible++;
        }
      });
      if (visible) {
        nav.hidden = false;

        const jsonLd = document.getElementById('organization-jsonld');
        const data = JSON.parse(jsonLd.textContent);
        const organization = data['@graph'].find((item) => item['@type'] === 'Organization');
        organization.sameAs = Object.values(links);
        jsonLd.textContent = JSON.stringify(data);
      }
    } catch (_) {}
  }

  document.getElementById('share-facebook').addEventListener('click', () => {
    const shareUrl = encodeURIComponent(campaignUrl('facebook'));
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`, '_blank', 'noopener,noreferrer');
  });

  document.querySelectorAll('[data-copy-campaign]').forEach((button) => {
    button.addEventListener('click', async () => {
      const source = button.getAttribute('data-copy-campaign');
      try {
        await navigator.clipboard.writeText(campaignUrl(source));
        document.getElementById('share-status').textContent = `${source} campaign link copied.`;
      } catch (_) {
        document.getElementById('share-status').textContent = `Copy this link: ${campaignUrl(source)}`;
      }
    });
  });

  configureSocialLinks();
  load();
  </script>
</body>
</html>
