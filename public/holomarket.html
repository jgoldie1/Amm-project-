<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TryAMM HoloMarket & Asset Vault</title><style>body{font-family:system-ui;background:#0b0b12;color:#fff;margin:0;padding:24px}.wrap{max-width:1180px;margin:auto}.hero{padding:28px;border:1px solid #2d2d45;border-radius:18px;background:#11111c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}.card{padding:16px;border:1px solid #2d2d45;border-radius:16px;background:#151522}button{padding:10px 14px;border-radius:10px;border:0;cursor:pointer}.muted{color:#b9b9c9}.pill{display:inline-block;padding:4px 8px;border:1px solid #3f3f63;border-radius:999px;font-size:12px;margin:2px}input{width:100%;padding:12px;border-radius:10px;border:1px solid #34344f;background:#0f0f18;color:#fff;margin:12px 0}</style></head><body><div class='wrap'><section class='hero'><h1>HoloMarket + Asset Vault</h1><p>Create once. Protect with Digital DNA. Reuse everywhere. License safely. Earn repeatedly.</p><input id='q' placeholder='Search assets, holograms, characters, HoloFX, music, templates...'><div id='status' class='muted'>Loading marketplace…</div></section><section><h2>Marketplace</h2><div id='listings' class='grid'></div></section><section><h2>Your Asset Vault</h2><p class='muted'>Private creator management requires TryAMM Passport/Auth in production. This page currently displays public-safe API data only.</p><div id='assets' class='grid'></div></section></div><script>const $=s=>document.querySelector(s);let listings=[],assets=[];function card(x,type){const a=x.asset||x;return `<div class='card'><h3>${a.name||x.title||'Untitled'}</h3><div>${(a.tags||[]).slice(0,5).map(t=>`<span class='pill'>${t}</span>`).join('')}</div><p class='muted'>${a.description||''}</p>${type==='listing'?`<p><strong>$${Number(x.priceUsd||0).toFixed(2)}</strong> · ${x.licenseId||''}</p>`:''}<p class='muted'>DNA: ${a.dnaId||'pending'} · ${a.moderationStatus||''}</p></div>`}function render(){const q=$('#q').value.toLowerCase();$('#listings').innerHTML=listings.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>card(x,'listing')).join('')||'<p class="muted">No listings yet.</p>';$('#assets').innerHTML=assets.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>card(x,'asset')).join('')||'<p class="muted">No public assets yet.</p>'}async function load(){try{const [l,a]=await Promise.all([fetch('/api/assets/listings').then(r=>r.json()),fetch('/api/assets').then(r=>r.json())]);listings=l.listings||[];assets=a.assets||[];$('#status').textContent=`${listings.length} active listings · ${assets.length} assets indexed`;render()}catch(e){$('#status').textContent='Marketplace API unavailable.'}}$('#q').addEventListener('input',render);load();</script></body></html>
