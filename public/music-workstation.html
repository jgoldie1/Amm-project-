<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TryAMM Music Workstation</title><style>body{font-family:system-ui;max-width:1000px;margin:auto;padding:20px}.track{display:grid;grid-template-columns:60px 1fr 80px;gap:8px;align-items:center;margin:6px 0}input,button{padding:8px}</style></head><body><h1>TryAMM Music Workstation</h1><p>64-track project workspace MVP. This page manages track plans and session structure; browser audio recording/mixing engine still requires Web Audio implementation and persistent storage.</p><button id='add'>Add track</button><button id='save'>Save project locally</button><div id='tracks'></div><script>const box=document.getElementById('tracks');let data=JSON.parse(localStorage.tryamm64||'[]');function render(){box.innerHTML='';data.forEach((t,i)=>{let d=document.createElement('div');d.className='track';d.innerHTML=`<b>${i+1}</b><input value="${t.name||'Track '+(i+1)}"><button>Delete</button>`;d.querySelector('input').oninput=e=>data[i].name=e.target.value;d.querySelector('button').onclick=()=>{data.splice(i,1);render()};box.appendChild(d)})}add.onclick=()=>{if(data.length<64){data.push({name:'Track '+(data.length+1)});render()}};save.onclick=()=>{localStorage.tryamm64=JSON.stringify(data);alert('Project layout saved locally')};if(!data.length)for(let i=0;i<8;i++)data.push({name:'Track '+(i+1)});render();</script></body></html>
