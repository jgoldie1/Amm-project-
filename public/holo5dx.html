<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Holo5DX Control Console</title>
  <style>
    body{font-family:system-ui;margin:0;background:#0b1020;color:#fff}main{max-width:980px;margin:auto;padding:24px}.panel{background:#121a31;border:1px solid #34436b;border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;margin:8px 0}input,select,button{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #52618b;background:#0f1730;color:#fff}button{cursor:pointer;background:#243a72}pre{white-space:pre-wrap;word-break:break-word;background:#090e1c;padding:12px;border-radius:10px}.muted{opacity:.75}
  </style>
</head>
<body><main>
  <h1>Holo5DX Control Console</h1>
  <p class="muted">Plan standard 3D and Quantum Cone multi-view output. Physical holographic/light-field output still requires calibrated compatible optical hardware.</p>
  <section class="panel">
    <h2>Render Plan</h2>
    <div class="grid">
      <label>Hardware profile<select id="hardware"><option>STANDARD-3D</option><option>QCONE-4V-PROTOTYPE</option><option>QCONE-8V-PROTOTYPE</option></select></label>
      <label>Viewer distance (mm)<input id="distance" type="number" value="600"></label>
      <label>Viewing cone (deg)<input id="viewCone" type="number" value="60"></label>
      <label>Width px<input id="width" type="number" value="1920"></label>
      <label>Height px<input id="height" type="number" value="1080"></label>
    </div>
    <button id="plan" type="button">Generate Render Plan</button>
    <pre id="planOut">No render plan yet.</pre>
  </section>
  <section class="panel">
    <h2>Quantum Cone Calibration</h2>
    <div class="grid">
      <label>Cone height mm<input id="coneHeight" type="number" value="120"></label>
      <label>Cone angle deg<input id="coneAngle" type="number" value="45"></label>
      <label>Display width mm<input id="displayWidth" type="number" value="300"></label>
    </div>
    <button id="calibrate" type="button">Create Calibration Record</button>
    <pre id="calOut">No calibration record yet.</pre>
  </section>
<script>
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
const $=id=>document.getElementById(id);
$('plan').addEventListener('click',async()=>{try{$('planOut').textContent=JSON.stringify(await post('/api/holo5dx/render-plan',{hardwareProfileId:$('hardware').value,viewerDistanceMm:Number($('distance').value),viewingConeDeg:Number($('viewCone').value),width:Number($('width').value),height:Number($('height').value)}),null,2)}catch(e){$('planOut').textContent=e.message}});
$('calibrate').addEventListener('click',async()=>{try{$('calOut').textContent=JSON.stringify(await post('/api/holo5dx/calibration',{hardwareProfileId:$('hardware').value,coneHeightMm:Number($('coneHeight').value),coneAngleDeg:Number($('coneAngle').value),displayWidthMm:Number($('displayWidth').value)}),null,2)}catch(e){$('calOut').textContent=e.message}});
</script>
</main></body></html>
