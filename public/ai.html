<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TryAMM AI Command Center</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{min-height:100vh;background:radial-gradient(circle at top,#24164c,#070712 55%);color:#fff}.ai-shell{max-width:1100px;margin:auto;padding:24px}.ai-grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{background:rgba(16,16,34,.92);border:1px solid rgba(164,121,255,.35);border-radius:18px;padding:18px}.agent{width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:14px;border:1px solid #6547a6;background:#18152d;color:#fff}.agent.active{outline:2px solid #d7b3ff}.messages{height:58vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:6px}.message{max-width:82%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.45}.message.user{align-self:flex-end;background:#6547a6}.message.assistant{align-self:flex-start;background:#20203b}.composer{display:flex;gap:10px;margin-top:12px}.composer textarea{flex:1;min-height:72px;border-radius:14px;padding:12px;background:#0d0d1d;color:#fff;border:1px solid #55477d}.composer button{min-width:120px}.status{font-size:.9rem;color:#c7bddf}.warning{background:#3c2514;padding:10px;border-radius:12px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}@media(max-width:760px){.ai-grid{grid-template-columns:1fr}.messages{height:48vh}}
  </style>
</head>
<body>
  <main class="ai-shell">
    <div class="topbar"><div><h1>TryAMM AI Command Center</h1><p class="status" id="status">Checking AI systems…</p></div><a class="button" href="/">Back to TryAMM</a></div>
    <div class="ai-grid">
      <aside class="panel">
        <h2>Choose an agent</h2>
        <button class="agent active" data-agent="hologpt"><strong>HoloGPT</strong><br><small>Creative, streaming and holographic copilot</small></button>
        <button class="agent" data-agent="stubbs"><strong>Stubbs AI</strong><br><small>Founder, engineering and operations copilot</small></button>
        <p class="warning">Sign in on the main TryAMM page first. AI conversations are private to your account.</p>
        <button id="newConversation" class="agent">Start new conversation</button>
      </aside>
      <section class="panel">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="composer" class="composer">
          <textarea id="prompt" maxlength="6000" required placeholder="Ask HoloGPT or Stubbs AI…"></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </div>
  </main>
  <script src="/ai.js"></script>
</body>
</html>
