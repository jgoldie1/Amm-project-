<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TryAMM Unified Feed</title>
<style>
:root{--bg:#050814;--panel:#0b1324;--border:#263d69;--text:#fff;--muted:#9fb0cf;--accent:#4fe3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.app{min-height:100vh}.tabs{position:sticky;top:0;z-index:10;display:flex;gap:8px;overflow:auto;padding:12px;background:rgba(5,8,20,.95);border-bottom:1px solid var(--border)}.tabs button{white-space:nowrap;border:1px solid var(--border);background:#101b38;color:#fff;border-radius:999px;padding:9px 12px}.tabs button[aria-selected="true"]{outline:2px solid var(--accent)}.feed{scroll-snap-type:y mandatory}.item{min-height:78vh;scroll-snap-align:start;padding:18px;display:grid;align-items:end;border-bottom:1px solid var(--border);background:radial-gradient(circle at 50% 30%,#162743,#070c18 60%,#050814)}.card{max-width:760px;background:rgba(8,14,32,.8);border:1px solid var(--border);border-radius:18px;padding:16px}.meta{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button{border:1px solid var(--border);background:#101b38;color:#fff;border-radius:999px;padding:9px 12px;text-decoration:none}.bottom{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#070c18;border-top:1px solid var(--border)}.bottom a{padding:12px 6px;text-align:center;color:#fff;text-decoration:none;font-size:13px}.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<nav class="tabs" aria-label="Feed categories" id="tabs"></nav>
<main class="feed" id="feed" aria-live="polite"></main>
<nav class="bottom" aria-label="Primary navigation">
<a href="/">Home</a><a href="/discover">Discover</a><a href="/create">Create</a><a href="/inbox">Inbox</a><a href="/myworld.html">My World</a>
</nav>
</div>
<script>
const tabs=[['for-you','For You'],['following','Following'],['live','Live'],['shop-live','Shop Live'],['business-live','Business Live'],['reels','Reels'],['threads','Threads'],['news-tv','News/TV'],['holomusic','HoloMusic'],['games','Games'],['local','Local']];
const demo=[
{id:'1',contentType:'live-stream',title:'Creator Live',creator:'@creator',caption:'Live now on TryAMM',actions:['Watch Live','Follow']},
{id:'2',contentType:'shop-live',title:'Shop Live',creator:'@shop',caption:'Buy without leaving the stream',actions:['Shop','Claim HoloCoupon']},
{id:'3',contentType:'business-live',title:'Business Live',creator:'Local Restaurant',caption:'Tonight’s special + pickup or delivery',actions:['Open HoloMenu','Order']},
{id:'4',contentType:'reel',title:'Reel',creator:'@artist',caption:'Short-form creator discovery',actions:['Like','Share']},
{id:'5',contentType:'thread-post',title:'Threads',creator:'@community',caption:'Text, replies, links, images and discussion',actions:['Reply','Repost']},
{id:'6',contentType:'news-clip',title:'OmniNews',creator:'TryAMM News',caption:'Local, global, business and entertainment clips',actions:['Watch Full Story']},
{id:'7',contentType:'music-video',title:'HoloMusic',creator:'Independent Artist',caption:'Music, merch, fan club and HoloVerse concerts',actions:['Listen','Follow Artist']},
{id:'8',contentType:'game-clip',title:'GameVerse',creator:'Court Kings',caption:'Watch, challenge, play, earn verified XP/Beans',actions:['Play','Watch']},
{id:'9',contentType:'local-business',title:'HoloLocal',creator:'Nearby Business',caption:'Deals, restaurants, events, Ride and Delivery',actions:['View Deal','Get Directions']}
];
let active='for-you';
function renderTabs(){const root=document.getElementById('tabs');root.innerHTML='';tabs.forEach(([id,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-selected',String(id===active));b.addEventListener('click',()=>{active=id;renderTabs();renderFeed();});root.appendChild(b);});}
function match(item){if(active==='for-you'||active==='following')return true;if(active==='live')return item.contentType==='live-stream';if(active==='shop-live')return item.contentType==='shop-live';if(active==='business-live')return item.contentType==='business-live';if(active==='reels')return item.contentType==='reel';if(active==='threads')return item.contentType==='thread-post';if(active==='news-tv')return ['news-clip','tv-clip'].includes(item.contentType);if(active==='holomusic')return ['music-track','music-video'].includes(item.contentType);if(active==='games')return ['game-clip','game-live'].includes(item.contentType);if(active==='local')return ['local-business','holo-coupon','business-live'].includes(item.contentType);return true;}
function renderFeed(){const root=document.getElementById('feed');root.innerHTML='';const items=demo.filter(match);if(!items.length){root.innerHTML='<div class="empty">No items available in this category yet.</div>';return;}items.forEach(item=>{const section=document.createElement('section');section.className='item';section.innerHTML=`<div class="card"><div class="meta">${item.contentType}</div><h1>${item.title}</h1><strong>${item.creator}</strong><p>${item.caption}</p><div class="actions">${item.actions.map(a=>`<button type="button">${a}</button>`).join('')}</div></div>`;root.appendChild(section);});}
renderTabs();renderFeed();
</script>
</body>
</html>
