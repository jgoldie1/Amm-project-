<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TryAMM Universal Anime Studio</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#111;color:#fff}main{max-width:980px;margin:auto;padding:24px}h1{font-size:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #555;background:#1c1c1c;color:#fff}textarea{min-height:120px}button{cursor:pointer;font-weight:700;margin-top:16px}.card{background:#1a1a1a;padding:18px;border-radius:14px;margin-top:18px}.status{white-space:pre-wrap}</style>
</head>
<body>
<main>
  <h1>TryAMM Universal Anime Studio</h1>
  <p>Create original anime projects across eras, styles, genres and formats.</p>
  <form id="studioForm" class="card">
    <div class="grid">
      <div><label for="title">Project title</label><input id="title" required /></div>
      <div><label for="era">Era</label><select id="era"></select></div>
      <div><label for="visualStyle">Visual style</label><select id="visualStyle"></select></div>
      <div><label for="genre">Genre</label><select id="genre"></select></div>
      <div><label for="format">Format</label><select id="format"></select></div>
      <div><label for="quality">Quality</label><select id="quality"></select></div>
    </div>
    <label for="premise" style="margin-top:14px">Story premise</label>
    <textarea id="premise" placeholder="Describe the world, characters, conflict and desired outcome."></textarea>
    <button type="submit">Create anime project</button>
  </form>
  <section class="card"><h2>Status</h2><div id="status" class="status">Loading catalog…</div></section>
</main>
<script>
const byId=id=>document.getElementById(id);
const fill=(id,items)=>{byId(id).innerHTML=items.map(v=>`<option>${v}</option>`).join('')};
async function boot(){
  const res=await fetch('/api/anime-studio/catalog');
  if(!res.ok) throw new Error('Anime Studio API is not wired into server.js yet.');
  const c=await res.json();
  fill('era',c.eras); fill('visualStyle',c.visualStyles); fill('genre',c.genres); fill('format',c.formats); fill('quality',c.qualityPresets);
  byId('status').textContent='Ready to create a project.';
}
byId('studioForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const payload={title:byId('title').value,era:byId('era').value,visualStyle:byId('visualStyle').value,genre:byId('genre').value,format:byId('format').value,quality:byId('quality').value,premise:byId('premise').value};
  const res=await fetch('/api/anime-studio/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
  byId('status').textContent=JSON.stringify(await res.json(),null,2);
});
boot().catch(err=>byId('status').textContent=err.message);
</script>
</body>
</html>
