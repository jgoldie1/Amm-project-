<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryAMM Universal Anime Studio</title><style>body{font-family:Arial,sans-serif;margin:0;background:#111;color:#fff}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #555;background:#1c1c1c;color:#fff}textarea{min-height:120px}button{cursor:pointer;font-weight:700;margin-top:16px}.card{background:#1a1a1a;padding:18px;border-radius:14px;margin-top:18px}.status,pre{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.bar{height:14px;background:#333;border-radius:999px;overflow:hidden;margin-top:12px}.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#22d3ee);transition:width .3s}.outputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.outputs img,.outputs iframe{width:100%;min-height:360px;border:0;border-radius:12px;background:#000}.muted{color:#bbb}</style></head><body><main><h1>TryAMM Universal Anime Studio</h1><p>Create original anime projects, production plans, key art and animated storyboards.</p><form id="studioForm" class="card"><div class="grid"><div><label for="title">Project title</label><input id="title" maxlength="120" required></div><div><label for="era">Era</label><select id="era"></select></div><div><label for="visualStyle">Visual style</label><select id="visualStyle"></select></div><div><label for="genre">Genre</label><select id="genre"></select></div><div><label for="format">Format</label><select id="format"></select></div><div><label for="quality">Quality</label><select id="quality"></select></div></div><label for="premise" style="margin-top:14px">Story premise</label><textarea id="premise" maxlength="3000" placeholder="Describe the world, characters, conflict and desired outcome."></textarea><button type="submit">Create anime project</button></form><section class="card"><h2>Production controls</h2><div class="grid"><div><label for="sceneCount">Scenes</label><input id="sceneCount" type="number" min="3" max="12" value="6"></div><div><label for="aspectRatio">Aspect ratio</label><select id="aspectRatio"><option>16:9</option><option>9:16</option><option>1:1</option><option>2.39:1</option></select></div><div><label for="frameRate">Frame rate</label><select id="frameRate"><option>24</option><option>30</option><option>60</option></select></div><div><label for="provider">Renderer</label><select id="provider"></select></div></div><div class="actions"><button id="planButton" type="button" disabled>Create production plan</button><button id="generateButton" type="button" disabled>Generate project package</button></div><div class="bar"><span id="progress"></span></div></section><section class="card"><h2>Status</h2><div id="status" class="status">Loading studio…</div></section><section id="planCard" class="card" hidden><h2>Production plan</h2><pre id="plan"></pre></section><section id="outputCard" class="card" hidden><h2>Generated outputs</h2><div class="outputs"><div><h3>Key art</h3><a id="imageLink" target="_blank" rel="noopener"><img id="imagePreview" alt="Generated anime key art"></a></div><div><h3>Animatic</h3><iframe id="videoPreview" title="Generated anime animatic"></iframe></div></div></section></main><script>const byId=id=>document.getElementById(id);let project=null;const fill=(id,items,map=v=>({value:v,label:v}))=>{byId(id).innerHTML=items.map(item=>{const x=map(item);return `<option value="${x.value}">${x.label}</option>`}).join('')};const payload=()=>({title:byId('title').value,era:byId('era').value,visualStyle:byId('visualStyle').value,genre:byId('genre').value,format:byId('format').value,quality:byId('quality').value,premise:byId('premise').value});const productionOptions=()=>({sceneCount:Number(byId('sceneCount').value),aspectRatio:byId('aspectRatio').value,frameRate:Number(byId('frameRate').value),provider:byId('provider').value});async function json(url,options){const res=await fetch(url,options);const body=await res.json();if(!res.ok)throw new Error(body.error||'Request failed');return body}async function boot(){const [c,p]=await Promise.all([json('/api/anime-studio/catalog'),json('/api/anime-studio/providers')]);fill('era',c.eras);fill('visualStyle',c.visualStyles);fill('genre',c.genres);fill('format',c.formats);fill('quality',c.qualityPresets);fill('provider',p.providers,x=>({value:x.id,label:`${x.name}${x.configured?'':' (not configured)'}`}));byId('status').textContent='Ready to create a project.'}byId('studioForm').addEventListener('submit',async e=>{e.preventDefault();try{project=await json('/api/anime-studio/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload())});byId('status').textContent=`Project created: ${project.id}`;byId('planButton').disabled=false;byId('generateButton').disabled=false}catch(err){byId('status').textContent=err.message}});byId('planButton').addEventListener('click',async()=>{try{const plan=await json(`/api/anime-studio/projects/${project.id}/plan`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(productionOptions())});byId('plan').textContent=JSON.stringify(plan,null,2);byId('planCard').hidden=false;byId('status').textContent=`Production plan ready: ${plan.id}`}catch(err){byId('status').textContent=err.message}});byId('generateButton').addEventListener('click',async()=>{try{byId('generateButton').disabled=true;const job=await json(`/api/anime-studio/projects/${project.id}/generate`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(productionOptions())});await poll(job.id)}catch(err){byId('status').textContent=err.message;byId('generateButton').disabled=false}});async function poll(id){const job=await json(`/api/anime-studio/jobs/${id}`);byId('progress').style.width=`${job.progress}%`;byId('status').textContent=`${job.stage}: ${job.progress}%`;if(job.status==='failed'){byId('status').textContent=job.error;byId('generateButton').disabled=false;return}if(job.status!=='completed'){setTimeout(()=>poll(id),700);return}const out=job.outputs;byId('imagePreview').src=out.image.url;byId('imageLink').href=out.image.url;byId('videoPreview').src=out.videoPreview.url;byId('plan').textContent=JSON.stringify(out.productionPlan,null,2);byId('planCard').hidden=false;byId('outputCard').hidden=false;byId('status').textContent=`Completed with ${out.provider.name}`;byId('generateButton').disabled=false}boot().catch(err=>byId('status').textContent=err.message);</script></body></html>
