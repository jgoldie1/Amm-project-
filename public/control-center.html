<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryAMM Control Center</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff}header,main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#151c33;border:1px solid #2b365d;border-radius:16px;padding:18px}button{padding:12px 16px;border-radius:10px;border:0;cursor:pointer}input{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box}.muted{color:#aab4d6}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><header><h1>TryAMM Production Control Center</h1><p class="muted">Creator finances, payouts, livestream infrastructure, Africa payments, and release readiness.</p></header><main><div class="card"><label>Bearer token<input id="token" type="password" placeholder="Paste session bearer token"></label><button id="load">Load dashboards</button></div><section class="grid" style="margin-top:16px"><article class="card"><h2>Creator</h2><pre id="creator">Sign in and load.</pre></article><article class="card"><h2>Wallet</h2><pre id="wallet">Sign in and load.</pre></article><article class="card"><h2>Media</h2><pre id="media">Sign in and load.</pre></article><article class="card"><h2>Africa providers</h2><pre id="africa">Loading public registry…</pre></article><article class="card"><h2>Admin</h2><pre id="admin">Administrator token required.</pre></article></section></main><script src="/control-center.js"></script></body></html>
