<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryAMM News</title><style>body{font-family:Arial,sans-serif;margin:0;background:#0b0f19;color:#fff}header{padding:20px;border-bottom:1px solid #2a3244}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#151c2b;border:1px solid #2a3244;border-radius:14px;padding:16px}.meta{color:#9fb0c8;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#25314a;margin-right:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{padding:10px 14px;border-radius:10px;border:0;cursor:pointer}a{color:#9fd3ff}</style></head><body><header><h1>TryAMM News</h1><p>Global, local, creator and live-news discovery with source and verification metadata.</p></header><main><div class="toolbar"><button data-cat="">All</button><button data-cat="local">Local</button><button data-cat="world">World</button><button data-cat="business">Business</button><button data-cat="sports">Sports</button><button data-cat="entertainment">Entertainment</button></div><div id="stories" class="grid"></div></main><script>
const root=document.getElementById('stories');
async function load(category=''){const q=category?`?category=${encodeURIComponent(category)}`:'';const r=await fetch('/api/news/stories'+q);const d=await r.json();root.innerHTML='';for(const s of d.stories||[]){const el=document.createElement('article');el.className='card';el.innerHTML=`<div><span class="badge">${s.category||'general'}</span><span class="badge">${s.verification||'unverified'}</span></div><h2>${escapeHtml(s.title)}</h2><p>${escapeHtml(s.summary||'')}</p><div class="meta">${escapeHtml(s.sourceName||'TryAMM Newsroom')} · ${new Date(s.publishedAt).toLocaleString()}</div>${s.sourceUrl?`<p><a href="${encodeURI(s.sourceUrl)}" target="_blank" rel="noopener noreferrer">Open source</a></p>`:''}`;root.appendChild(el)}if(!(d.stories||[]).length)root.innerHTML='<p>No published stories yet.</p>'}
function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>load(b.dataset.cat));load();
</script></body></html>
