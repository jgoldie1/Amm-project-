<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Living Game World Player | TryAMM</title>
  <meta name="description" content="Start a Living Game World session, run AI preflight checks, choose controller mode, and prepare TV casting." />
  <link rel="canonical" href="https://tryamm.online/play" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 24px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .card { border:1px solid #ccc; border-radius:12px; padding:16px; }
    button, select { padding:10px 12px; margin:4px 0; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f5f5f5; padding:12px; border-radius:8px; }
  </style>
</head>
<body>
  <h1>Living Game World Player</h1>
  <p>Choose one of the 11 game foundations, create a session, run AI preflight, and prepare a local or TV display handoff.</p>

  <label for="game">Game</label>
  <select id="game"></select>
  <label for="controller">Controller</label>
  <select id="controller">
    <option value="touch">Phone / touch</option>
    <option value="gamepad">Bluetooth gamepad</option>
    <option value="keyboard">Keyboard</option>
    <option value="voice-accessibility">Voice accessibility</option>
  </select>
  <div>
    <button id="start" type="button">Create play session</button>
    <button id="preflight" type="button" disabled>Run AI preflight</button>
    <button id="cast" type="button" disabled>Prepare TV casting</button>
    <button id="play" type="button" disabled>Mark playing</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <pre id="output">No session yet.</pre>

<script>
let current = null;
const output = document.getElementById('output');
const status = document.getElementById('status');

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function init() {
  const data = await api('/api/gameverse');
  const select = document.getElementById('game');
  data.games.forEach((game) => {
    const option = document.createElement('option');
    option.value = game.id;
    option.textContent = `${game.name} — ${game.status}`;
    select.appendChild(option);
  });
}

document.getElementById('start').addEventListener('click', async () => {
  try {
    current = await api('/api/living-world/sessions', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ gameId:document.getElementById('game').value, controllerMode:document.getElementById('controller').value })
    });
    output.textContent = JSON.stringify(current, null, 2);
    status.textContent = `Session created. Pairing code ${current.pairingCode}.`;
    ['preflight','cast','play'].forEach((id) => document.getElementById(id).disabled = false);
  } catch (e) { status.textContent = e.message; }
});

document.getElementById('preflight').addEventListener('click', async () => {
  if (!current) return;
  current = await api(`/api/living-world/sessions/${current.id}/preflight`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ runtimeAvailable:false })
  });
  output.textContent = JSON.stringify(current, null, 2);
  status.textContent = current.aiPreflight.status === 'ready' ? 'AI preflight passed.' : 'AI found preparation work before actual gameplay runtime can launch.';
});

document.getElementById('cast').addEventListener('click', async () => {
  if (!current) return;
  current = await api(`/api/living-world/sessions/${current.id}/cast`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ adapter:'browser-second-screen', target:'tv-browser' })
  });
  output.textContent = JSON.stringify(current, null, 2);
  status.textContent = `Open receiver on TV: ${current.receiverUrl}`;
});

document.getElementById('play').addEventListener('click', async () => {
  if (!current) return;
  current = await api(`/api/living-world/sessions/${current.id}/state`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ state:'playing' })
  });
  output.textContent = JSON.stringify(current, null, 2);
  status.textContent = 'Session marked playing. Actual game runtime must be attached to render gameplay.';
});

init().catch((e) => status.textContent = e.message);
</script>
</body>
</html>
