<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryAMM Safety Shell</title><style>body{font-family:Arial,sans-serif;margin:0;background:#101114;color:#fff}.wrap{max-width:760px;margin:auto;padding:32px}.card{background:#1b1d22;padding:24px;border-radius:16px;margin:16px 0}input,button,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:0}button{cursor:pointer;font-weight:700}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.tile{background:#262932;padding:16px;border-radius:12px}</style></head><body><div class="wrap"><h1>TryAMM</h1><p>Age-aware Google Play readiness shell</p><section id="onboarding" class="card"><h2>Set up account</h2><input id="uid" placeholder="User ID" value="demo-user"><input id="dob" type="date"><button id="start">Continue</button><pre id="result"></pre></section><section id="experience" class="card hidden"><h2 id="band"></h2><div id="features" class="grid"></div><button id="delete">Request account deletion</button><pre id="apiResult"></pre></section></div><script>let token='';const byBand={CHILD:['Family Feed','Curated Games','Guardian Messaging','Report','Block'],TEEN:['Teen Feed','Create Post','Teen Live','Teen Messaging','Report','Block','Mute'],ADULT:['Adult Feed','Create Post','Go Live','Direct Message','Marketplace','Creator Tools','Virtual Gifts','Report','Block','Mute']};document.querySelector('#start').onclick=async()=>{const r=await fetch('/api/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:uid.value,dateOfBirth:dob.value})});const j=await r.json();result.textContent=JSON.stringify(j,null,2);if(j.token){token=j.token;onboarding.classList.add('hidden');experience.classList.remove('hidden');band.textContent=j.user.ageBand+' EXPERIENCE';features.innerHTML=(byBand[j.user.ageBand]||[]).map(x=>'<div class="tile">'+x+'</div>').join('')}};document.querySelector('#delete').onclick=async()=>{const r=await fetch('/api/account-deletion',{method:'POST',headers:{authorization:'Bearer '+token}});apiResult.textContent=JSON.stringify(await r.json(),null,2)};</script></body></html>
