    <script>
      (()=>{
        document.documentElement.classList.toggle('tryamm-streetverse',location.pathname.startsWith('/streetverse'))
        const KEY='tryamm-asset-recovery-v28'
        const recover=()=>{
          try{
            if(sessionStorage.getItem(KEY))return
            sessionStorage.setItem(KEY,'1')
            const u=new URL(location.href)
            u.searchParams.set('_tryamm_recover','v28')
            location.replace(u.toString())
          }catch{location.reload()}
        }
        addEventListener('error',event=>{
          const target=event.target
          const asset=target&&(target.src||target.href)||''
          if(typeof asset==='string'&&asset.includes('/assets/'))recover()
        },true)
        if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='TRYAMM_STALE_ASSET')recover()})}
        addEventListener('load',()=>setTimeout(()=>{try{sessionStorage.removeItem(KEY)}catch{}},5000),{once:true})
      })()
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const SW_VERSION='20260904-streetverse-play-v3'
            const RELEASE_KEY='tryamm-release-version'
            const previousRelease=localStorage.getItem(RELEASE_KEY)
            if (previousRelease !== SW_VERSION && 'caches' in window) {
              const keys=await caches.keys()
              await Promise.all(keys.filter(key=>key.startsWith('tryamm-')).map(key=>caches.delete(key)))
              localStorage.setItem(RELEASE_KEY,SW_VERSION)
            }
            const registration = await navigator.serviceWorker.register('/sw.js?v=' + SW_VERSION, { updateViaCache: 'none' })
            await registration.update()
            if (registration.waiting) registration.waiting.postMessage({type:'SKIP_WAITING'})
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              const key = 'tryamm-sw-refresh-' + SW_VERSION
              if (!sessionStorage.getItem(key)) {
                sessionStorage.setItem(key, '1')
                location.reload()
              }
            })
          } catch (_) {}
        })
      }
    </script>
