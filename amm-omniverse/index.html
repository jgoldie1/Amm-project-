    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const SW_VERSION='20260903-streetverse-v14'
            const RELEASE_KEY='tryamm-release-version'
            const previousRelease=localStorage.getItem(RELEASE_KEY)
            if (previousRelease !== SW_VERSION && 'caches' in window) {
              const keys=await caches.keys()
              await Promise.all(keys.filter(key=>key.startsWith('tryamm-')).map(key=>caches.delete(key)))
              localStorage.setItem(RELEASE_KEY,SW_VERSION)
            }
            const registration = await navigator.serviceWorker.register('/sw.js?v=' + SW_VERSION, { updateViaCache: 'none' })
            await registration.update()
            if (registration.waiting) registration.waiting.postMessage({type:'SKIP_WAITING'})
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              const key = 'tryamm-sw-refresh-' + SW_VERSION
              if (!sessionStorage.getItem(key)) {
                sessionStorage.setItem(key, '1')
                location.reload()
              }
            })
          } catch (_) {}
        })
      }
    </script>
