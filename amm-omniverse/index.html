  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/streetverse-reel.js" defer></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const SW_VERSION='20260902-accessibility'
            const registration = await navigator.serviceWorker.register('/sw.js?v=' + SW_VERSION, { updateViaCache: 'none' })
            await registration.update()
            if (registration.waiting) registration.waiting.postMessage({type:'SKIP_WAITING'})
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              const key = 'tryamm-sw-refresh-' + SW_VERSION
              if (!sessionStorage.getItem(key)) {
                sessionStorage.setItem(key, '1')
                location.reload()
              }
            })
          } catch (_) {}
        })
      }
    </script>
  </body>
