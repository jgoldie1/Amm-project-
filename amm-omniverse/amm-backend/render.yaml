services:
  - type: web
    name: amm-omniverse-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run check
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://tryamm.online
      # Add these as secret environment variables in Render dashboard:
      # SUPABASE_URL
      # SUPABASE_SERVICE_KEY  (server-side service_role key; never expose to browser)
      # STRIPE_SECRET_KEY
      # STRIPE_WEBHOOK_SECRET
      # LIVEKIT_URL
      # LIVEKIT_API_KEY
      # LIVEKIT_API_SECRET
      # GEMINI_API_KEY          (Stubbs Brain 1 / Executive)
      # GEMINI_MODEL            (default: gemini-2.5-flash)
      # OPENAI_API_KEY          (Stubbs Brain 2 / independent critic + supervised agents)
      # OPENAI_STUBBS_CRITIC_MODEL (default: gpt-5.6-sol)
      # SIGN_LANGUAGE_PROVIDER_URL (optional)
      # SIGN_LANGUAGE_PROVIDER_KEY (optional)
