<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Make a Reel · TRYAMM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111017;color:#fff6ed;font:17px/1.5 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#ffe4af}h1{font-size:clamp(40px,9vw,78px);letter-spacing:-.06em;line-height:1;margin:32px 0 18px}h2{font-size:1rem;margin:0;color:#fccc92}aside{border-left:4px solid #e3a866;padding:8px 16px;margin:18px 0 26px;background:#211c24}p{margin:5px 0}.work{display:grid;grid-template-columns:1fr minmax(210px,36%);gap:28px}label{display:block;font-weight:650;margin-bottom:17px}input,select,button,.button{font:inherit;color:inherit;border:1px solid #766a7b;border-radius:8px;min-height:48px;padding:10px;background:#28232e}input,select{width:100%;display:block;margin-top:5px}button,.button{cursor:pointer;font-weight:660;display:inline-flex;align-items:center;text-decoration:none}.primary{background:#f2bd83;color:#20171c;border-color:transparent}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}video,canvas{width:100%;max-height:58vh;object-fit:contain;background:#100f15;border-radius:12px}.frame{align-self:start}small{color:#d1c7d0}fieldset{border:none;padding:0;margin:0;min-width:0}[hidden]{display:none!important}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93d8fa}#source{position:absolute;width:1px;height:1px;opacity:.01;pointer-events:none}@media(max-width:640px){.work{grid-template-columns:1fr}.frame{max-width:100%}main{padding:14px}h1{margin-top:20px}}
</style></head><body><main><header><b>TRYAMM / HoloDrama</b><a href="/holo-drama">Back to HoloDrama</a></header><h1>Make a Reel</h1>
<aside><h2>HoloGPT · Reel guide</h2><p id="guide" role="status">Choose your template, then add a phone clip and a soundtrack.</p></aside>
<div class="work"><div><fieldset id="settings"><label>TRYAMM template<select id="template"><option value="drama">HoloDrama · opening title</option><option value="business">Business spotlight · closing title</option></select></label>
<label>Title on screen<input id="title" maxlength="54" value="One Slot, Two Mics"></label>
<label>Phone clip<input id="clip" type="file" accept="video/*,.mov,.mp4"></label>
<label>Soundtrack<input id="sound" type="file" accept="audio/*,.mp3,.m4a,.wav"></label>
<p><small>The soundtrack replaces the clip audio. Preview the first 30 seconds in vertical format. Files stay on this device.</small></p>
<div class="actions"><button id="sample">Use Jacobie sample</button></div></fieldset>
<p id="files"></p><div class="actions"><button class="primary" id="preview" disabled>Build preview</button><button id="cancel" hidden>Cancel</button>
<a class="button primary" id="save" hidden download="TRYAMM-Reel.mp4">Export MP4</a><button id="share" hidden>Share or save to iPhone</button></div></div>
<div class="frame"><canvas id="art" width="720" height="1280" aria-label="Vertical Reel preview"></canvas><video id="result" controls playsinline hidden></video></div></div><video id="source" muted playsinline aria-hidden="true"></video>
</main><script type="module" src="editor.js"></script></body></html>
