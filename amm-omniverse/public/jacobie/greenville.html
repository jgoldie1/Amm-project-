<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="pages.css"><title>Greenville · Jacobie Visions</title></head><body><main><a href="index.html">← Jacobie Visions home</a><a href="https://amm-omniverse.vercel.app/streetverse?core=1&amp;character=jacobie&amp;world=greenville&amp;graphics=character">Full StreetVerse</a><a href="studio-room.html">Jacobie’s Studio Room</a><a href="nightclub.html">Mansion party &amp; nightclub</a><h1>Greenville campus chapter</h1><button id="start">Play as Jacobie</button><button hidden id="open-panel" aria-controls="mission-panel">Open mission panel</button><section id="mission-panel" aria-label="Campus mission"><div><button type="button" id="min-panel" aria-controls="mission-notes" aria-label="Minimize mission panel">− Minimize</button><button type="button" id="max-panel" aria-controls="mission-notes" aria-label="Maximize mission panel">□ Maximize</button><button type="button" id="close-panel" aria-label="Close mission panel">× Close</button></div><div id="mission-notes"><strong id="goal"></strong><p id="status" role="status">Start at Campus Welcome and visit eight campus stops.</p></div></section><script>
const panel = document.querySelector('#mission-panel');
const notes = document.querySelector('#mission-notes');
const opener = document.querySelector('#open-panel');
function resizeNotes(expanded) {
  notes.hidden = !expanded;
  document.querySelector('#min-panel').disabled = !expanded;
  document.querySelector('#max-panel').disabled = expanded;
}
document.querySelector('#min-panel').onclick = () => { resizeNotes(false); document.querySelector('#max-panel').focus(); };
document.querySelector('#max-panel').onclick = () => { resizeNotes(true); document.querySelector('#min-panel').focus(); };
document.querySelector('#close-panel').onclick = () => { panel.hidden = true; opener.hidden = false; opener.focus(); };
opener.onclick = () => { opener.hidden = true; panel.hidden = false; resizeNotes(true); document.querySelector('#min-panel').focus(); };
resizeNotes(false);
</script><div class="controls" hidden id="actions"><button id="guide">Walk to stop</button><button id="check">Check in</button><button data-dir="up">Forward</button><button data-dir="down">Back</button><button data-dir="left">Left</button><button data-dir="right">Right</button></div><canvas aria-label="Greenville 3D campus with Jacobie"></canvas></main><script type="module" src="campus.js"></script></body></html>
