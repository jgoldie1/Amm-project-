version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Detroit
    open-pull-requests-limit: 10
    groups:
      browser-xr:
        patterns:
          - three
          - lottie-web
          - livekit-client
      platform-core:
        patterns:
          - "@supabase/*"
          - zod
          - pino
          - pino-http
      commerce:
        patterns:
          - stripe
          - "@shopify/*"
    labels:
      - dependencies
      - advanced-alpha
