name: Production dependency repair candidate
on:
  push:
    branches: [fix/production-dependency-audit-20261126]
  pull_request:
    paths:
      - '.github/workflows/production-dependency-candidate.yml'
      - 'amm-omniverse/package.json'
      - 'amm-omniverse/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate compatible lockfile candidate
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund --audit-level=high
      - name: Audit candidate production dependencies
        id: production_audit
        if: always()
        run: npm audit --omit=dev --audit-level=moderate
      - name: Clean install candidate without lifecycle scripts
        if: ${{ !cancelled() && steps.production_audit.outcome == 'success' }}
        id: candidate_install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build candidate
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm run build
      - name: Candidate typecheck
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm run typecheck
      - name: Candidate regression contracts
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: |
          npm run test:industry-resilience
          npm run test:live-lifecycle
      - name: Forge tooling regression
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm run forge:check
      - name: Graphics runtime regression
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm run graphics:check
      - name: StreetVerse RP action regression
        id: rp_regression
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm run rp-actions:check
      - name: Compare failed RP contract with PR base
        if: ${{ !cancelled() && steps.rp_regression.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- tests/rp-action-search-bj-regression-contract.mjs public/streetverse-kingdom/02-physics-traffic.js
      - name: Business income regression
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm run business-income:check
      - name: Capture remaining dependency paths and audit
        if: always()
        run: |
          npm explain minimatch glob vite launch-editor > dependency-paths.txt 2>&1 || true
          npm audit --json > dependency-audit.json || true
      - name: Inspect tooling upgrade paths
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: |
          npm explain minimatch > tooling-upgrade-paths.txt
          npm explain glob >> tooling-upgrade-paths.txt
          for package in @gltf-transform/cli @donmccurdy/caporal eslint typescript-eslint vite; do
            npm view "$package@latest" version engines dependencies peerDependencies --json >> tooling-upgrade-paths.txt
          done
      - name: Probe compatible tooling updates without changing candidate
        if: ${{ !cancelled() && steps.candidate_install.outcome == 'success' }}
        run: npm outdated --json > tooling-outdated.json || test "$?" -eq 1
      - name: Capture dependency diff
        if: always()
        run: git diff -- package.json package-lock.json > dependency-candidate.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-dependency-candidate
          path: |
            amm-omniverse/package-lock.json
            amm-omniverse/dependency-candidate.patch
            amm-omniverse/tooling-upgrade-paths.txt
            amm-omniverse/tooling-outdated.json
            amm-omniverse/dependency-paths.txt
            amm-omniverse/dependency-audit.json
