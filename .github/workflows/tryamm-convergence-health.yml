name: TRYAMM Convergence Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - developer-vic
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/tryamm-convergence-health.yml'

permissions:
  contents: read

jobs:
  production-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production control plane
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          targets = [
              ("public-web", "https://tryamm.online/", True),
              ("convergence-api", "https://tryamm.online/api/system/convergence", True),
              ("render-backend", "https://amm-project-1-rpz9.onrender.com/", True),
          ]

          failures = []
          for name, url, required in targets:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "TRYAMM-GitHub-Convergence/1.0"})
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read(250000).decode("utf-8", "replace")
                      print(f"{name}: HTTP {response.status} {response.geturl()}")
                      if name == "convergence-api":
                          try:
                              payload = json.loads(body)
                              print("control-plane overall:", payload.get("overall"))
                              print("deployment commit:", (payload.get("deployment") or {}).get("commitSha"))
                              if payload.get("overall") != "healthy":
                                  failures.append(f"{name} reports {payload.get('overall')}")
                          except Exception as exc:
                              failures.append(f"{name} returned invalid JSON: {exc}")
              except Exception as exc:
                  print(f"{name}: FAILED {exc}")
                  if required:
                      failures.append(f"{name}: {exc}")

          if failures:
              print("\nCONVERGENCE GATE FAILED")
              for item in failures:
                  print(" -", item)
              sys.exit(1)

          print("\nCONVERGENCE GATE GREEN")
          PY
