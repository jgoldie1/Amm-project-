name: Stubbs Mobility 360 preview validation
on:
  pull_request:
    paths:
      - 'amm-omniverse/public/mobility360.html'
      - 'amm-omniverse/public/mobility360-help.html'
      - 'amm-omniverse/public/mobility360-experience.js'
      - 'amm-omniverse/public/mobility360-experience.css'
      - 'amm-omniverse/public/mobility360-assistant.js'
      - 'amm-omniverse/public/mobility360-compare.js'
      - 'amm-omniverse/public/mobility360-compare.css'
      - 'amm-omniverse/public/mobility360-assistant.css'
      - 'amm-omniverse/src/components/HoloGPTAssistant.tsx'
      - 'amm-omniverse/public/mobility360-learn.html'
      - 'amm-omniverse/public/mobility360-media.json'
      - 'amm-omniverse/docs/STUBBS_MOBILITY360_*.md'
      - 'amm-omniverse/src/App.tsx'
      - 'amm-omniverse/src/components/TryAMMHome.tsx'
      - 'amm-omniverse/src/components/AllAmericanOmnichannelCenter.tsx'
      - 'tests/mobility360-storefront-contract.mjs'
      - 'tests/mobility360-stubbs-ai-assistant-contract.mjs'
      - 'tests/mobility360-product-comparison-contract.mjs'
      - 'tests/mobility360-customer-ready-contract.mjs'
      - '.github/workflows/stubbs-mobility360-preview.yml'
  push:
    branches:
      - main
      - 'feat/mobility360-*'
      - 'feat/stubbs-mobility360-*'
    paths:
      - 'amm-omniverse/public/mobility360.html'
      - 'amm-omniverse/public/mobility360-help.html'
      - 'amm-omniverse/public/mobility360-experience.js'
      - 'amm-omniverse/public/mobility360-experience.css'
      - 'amm-omniverse/public/mobility360-assistant.js'
      - 'amm-omniverse/public/mobility360-compare.js'
      - 'amm-omniverse/public/mobility360-compare.css'
      - 'amm-omniverse/public/mobility360-assistant.css'
      - 'amm-omniverse/src/components/HoloGPTAssistant.tsx'
      - 'amm-omniverse/public/mobility360-learn.html'
      - 'amm-omniverse/public/mobility360-media.json'
      - 'amm-omniverse/docs/STUBBS_MOBILITY360_*.md'
      - 'amm-omniverse/src/App.tsx'
      - 'amm-omniverse/src/components/TryAMMHome.tsx'
      - 'amm-omniverse/src/components/AllAmericanOmnichannelCenter.tsx'
      - 'tests/mobility360-storefront-contract.mjs'
      - 'tests/mobility360-stubbs-ai-assistant-contract.mjs'
      - 'tests/mobility360-product-comparison-contract.mjs'
      - 'tests/mobility360-customer-ready-contract.mjs'
      - '.github/workflows/stubbs-mobility360-preview.yml'
permissions:
  contents: read
jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate safety gates and navigation
        run: |
          node --check amm-omniverse/public/mobility360-assistant.js
          node --check amm-omniverse/public/mobility360-compare.js
          node --check amm-omniverse/public/mobility360-experience.js
          node --test tests/mobility360-storefront-contract.mjs tests/mobility360-stubbs-ai-assistant-contract.mjs tests/mobility360-product-comparison-contract.mjs tests/mobility360-customer-ready-contract.mjs
