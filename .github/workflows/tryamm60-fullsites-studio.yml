name: TRYAMM 60 Full Websites and Omni Box Story Preview
on:
  push:
    branches: ['feature/tryamm-60-fullsites-omnibox-preview-20261020']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-websites:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install locked packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm sixty templates and studio source contracts
        run: node --test tests/tryamm60-source-contract.test.mjs
      - name: Compile TypeScript
        run: npm run typecheck
      - name: Build website and owned GLBs
        run: npm run build
      - name: Verify deployable business and game entries
        run: |
          test -s dist/site-demo.html
          test -s dist/business-app.html
          test -s dist/index.html
          test -s dist/generated-assets/native/kit/tree.glb
      - name: Install mobile browser test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.57.0
      - name: Install mobile test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify 60 sites and Omni Box on simulated iPhone and Android
        run: npx playwright test --config playwright.tryamm60.config.ts
