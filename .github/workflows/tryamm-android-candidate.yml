name: TRYAMM Android Launch Candidate

on:
  workflow_dispatch:
  push:
    branches: [developer-vic]
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/tryamm-android-candidate.yml'

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Verify web app
        run: npm run typecheck && npm run build
      - name: Generate Android shell
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Verify target SDK
        run: grep -R "targetSdkVersion" android/variables.gradle android/app/build.gradle || true
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Build unsigned release bundle
        run: cd android && ./gradlew bundleRelease
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tryamm-android-candidate
          path: |
            amm-omniverse/android/app/build/outputs/apk/debug/*.apk
            amm-omniverse/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
