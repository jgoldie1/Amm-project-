name: Quantum Forge isolated verification
on:
  push:
    branches: [agent/bj-asset-recovery-20261030]
    paths: ['tools/quantum-forge-*', '.github/workflows/quantum-forge-isolated.yml']
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/quantum-forge-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated module tests
        working-directory: tools
        run: |
          node --test quantum-forge-core.test.mjs quantum-forge-pipeline.test.mjs quantum-forge-bridge.test.mjs quantum-forge-character.test.mjs quantum-forge-recovered-character.test.mjs quantum-forge-security.test.mjs
      - name: Install preview dependencies
        run: npm install --no-audit --no-fund
      - name: Build isolated preview
        run: npm run build
      - name: Confirm generated pages
        run: |
          test -s dist/index.html
          test -s dist/character-lab.html
