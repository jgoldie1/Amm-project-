name: StreetVerse Recovered 3D Cast Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'amm-omniverse/assets/StreetVerse_3_Character_GLBS_Extracted.zip'
      - '.github/workflows/streetverse-recovered-cast-gate.yml'
permissions:
  contents: read
jobs:
  validate-recovered-glbs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify exact owner-recovered model bytes, skins, meshes, animations
        run: node scripts/import-recovered-cast.mjs && node scripts/verify-recovered-cast-assets.mjs
      - name: Compile recovered models into game
        run: npm run typecheck && npx vite build
      - name: Install Chromium for real GLB render test
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0 && npx playwright install --with-deps chromium
      - name: Prove BJ, Jacobie and LaTeasia in browser canvas
        run: npx playwright test tests/e2e/streetverse-recovered-cast.spec.ts --project=mobile-chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-cast-render-proof
          path: |
            amm-omniverse/test-results/
            amm-omniverse/playwright-report/
          retention-days: 14
          if-no-files-found: warn
