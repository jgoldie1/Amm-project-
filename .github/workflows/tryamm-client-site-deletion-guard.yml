name: TRYAMM Client-Site Deletion Guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject unreviewed site file deletions
        run: node scripts/check-site-preservation.cjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
