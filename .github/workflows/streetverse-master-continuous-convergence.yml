name: StreetVerse Master Continuous Convergence

on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Hourly engineering passes (max 6 recommended)"
        required: false
        default: "6"
      interval_minutes:
        description: "Minutes between engineering passes"
        required: false
        default: "60"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: streetverse-master-continuous-convergence
  cancel-in-progress: false

jobs:
  converge:
    name: Kingdom + West Side + CrossVerse + CampusVerse + Creator convergence
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      APP_DIR: amm-omniverse
      KINGDOM_DIR: amm-omniverse/public/streetverse-kingdom
      WORK_BRANCH: automation/streetverse-master-continuous-results
      PASSES: ${{ inputs.passes || '6' }}
      INTERVAL_MINUTES: ${{ inputs.interval_minutes || '60' }}

    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Install Omniverse dependencies
        working-directory: amm-omniverse
        run: npm ci --include=dev --no-audit --no-fund

      - name: Initialize evidence and repair branch
        run: |
          set -euo pipefail
          git config user.name "TRYAMM Continuous Convergence"
          git config user.email "actions@users.noreply.github.com"
          git switch -C "$WORK_BRANCH"
          mkdir -p release-evidence/streetverse-master
          {
            echo "# StreetVerse Master Continuous Convergence"
            echo
            echo "- Started UTC: $(date -u -Iseconds)"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Purpose: reusable six-hour convergence cycle"
            echo "- Scope: Kingdom city + West Side + CrossVerse + CampusVerse + Reels/OmniBox creator flow + one-hand controls + production build"
          } > release-evidence/streetverse-master/summary.md

      - name: Run continuous convergence passes
        id: converge
        working-directory: amm-omniverse
        run: |
          set -u
          START_EPOCH=$(date +%s)
          GREEN_PASSES=0
          RED_PASSES=0
          SOURCE_COMMITS=0
          EXECUTED_PASSES=0
          BUILD_MODE=0
          BUILD_MODE_PASSES=0
          FIRST_GREEN_PASS=0

          run_gate() {
            local name="$1"
            shift
            set +e
            "$@" > "$PASS_DIR/$name.log" 2>&1
            local code=$?
            set -e
            echo "$name=$code" >> "$PASS_DIR/status.env"
            if [ "$code" -ne 0 ]; then
              echo "::warning::$name failed on convergence pass $PASS"
            fi
            return 0
          }

          for PASS in $(seq 1 "$PASSES"); do
            EXECUTED_PASSES=$((EXECUTED_PASSES+1))
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            PASS_DIR="../release-evidence/streetverse-master/pass-$PASS-$STAMP"
            mkdir -p "$PASS_DIR"
            : > "$PASS_DIR/status.env"

            NOW_EPOCH=$(date +%s)
            ELAPSED_SEC=$((NOW_EPOCH - START_EPOCH))
            ELAPSED_MIN=$((ELAPSED_SEC / 60))
            ELAPSED_HOURS=$(awk "BEGIN {printf \"%.2f\", $ELAPSED_MIN/60}")

            {
              echo "# Continuous convergence pass $PASS"
              echo
              echo "- UTC: $(date -u -Iseconds)"
              echo "- Elapsed: $ELAPSED_HOURS hours"
              echo "- Commit entering pass: $(git rev-parse HEAD)"
            } > "$PASS_DIR/README.md"

            run_gate repair-entry node scripts/repair-streetverse-entry.mjs
            run_gate repair-hero node scripts/inject-streetverse-hero-spawn.mjs

            if [ "$BUILD_MODE" -eq 1 ]; then
              echo "- BUILD MODE: using remaining engineering time on both TRYAMM app and StreetVerse game." >> "$PASS_DIR/README.md"

              # APP lane
              run_gate build-app-release node tests/app-release-convergence-contract.mjs
              run_gate build-app-navigation node tests/canonical-navigation-owner-contract.mjs
              run_gate build-app-mobile-navigation node tests/mobile-navigation-carousel-repair-contract.mjs
              run_gate build-app-holoverse node tests/holoverse-ecosystem-convergence-contract.mjs
              run_gate build-app-commerce node tests/all-american-omnichannel-center-contract.mjs
              run_gate build-app-money node tests/game-app-business-income-contract.mjs
              run_gate build-app-business-revenue node tests/el-saturn-business-revenue-contract.mjs
              run_gate build-app-business-pricing node tests/business-completion-pricing-contract.mjs
              run_gate build-app-domain-provisioning node tests/domain-provisioning-contract.mjs
              run_gate build-app-quantum-growth node tests/quantum-seo-back-channel-contract.mjs               tests/kingdom-googolplex-regression-contract.mjs               tests/domain-provisioning-contract.mjs               tests/quantum-seo-back-channel-contract.mjs

              # STREETVERSE lane
              run_gate build-native-assets npm run native:assets
              run_gate build-streetverse-visible node tests/streetverse-visible-convergence-contract.mjs
              run_gate build-streetverse-gameplay node tests/streetverse-core-gameplay-dock-contract.mjs
              run_gate build-streetverse-mobile node tests/streetverse-iphone-first-journey-contract.mjs
              run_gate build-streetverse-controls node tests/streetverse-unified-mobile-controls-contract.mjs
              run_gate build-streetverse-city node tests/streetverse-chicago-alive-contract.mjs
              run_gate build-streetverse-logistics node tests/streetverse-logistics-jobs-bridge-contract.mjs
              run_gate build-streetverse-kingdom-regression node tests/kingdom-googolplex-regression-contract.mjs
              run_gate build-streetverse-kingdom-memory node scripts/capture-kingdom-googolplex-memory.mjs               tests/el-saturn-business-revenue-contract.mjs
              run_gate build-streetverse-mega-fix bash scripts/streetverse-bj-family-mega-fix.sh
              run_gate build-asset-tournament node scripts/streetverse-asset-tournament.mjs "$PASS_DIR/streetverse-asset-tournament.json"

              echo "build_mode_app_lane=1" >> "$PASS_DIR/status.env"
              echo "build_mode_streetverse_lane=1" >> "$PASS_DIR/status.env"
            fi

            for testfile in               tests/west-side-campus-11am-convergence-contract.mjs               tests/circle-park-chicago-completion-contract.mjs               tests/circle-park-west-side-jefferson-emergency-contract.mjs               tests/circle-park-asset-forge-production-wave-contract.mjs               tests/uic-greenville-world-gateway-contract.mjs               tests/illinois-campusverse-network-contract.mjs               tests/illinois-rollout-gate-contract.mjs               tests/illinois-rollout-performance-cap-contract.mjs               tests/illinois-rollout-serialization-contract.mjs               tests/streetverse-chicago-grid-reality-contract.mjs               tests/streetverse-one-hand-integration-contract.mjs               tests/crossverse-campusverse-bridge-contract.mjs               tests/kingdom-streetverse-bridge-contract.mjs               tests/streetverse-rapier-physics-contract.mjs               tests/unreal-mcp-readiness-contract.mjs               tests/graphics-acceleration-runtime-contract.mjs               tests/omnifabric-compute-router-contract.mjs               tests/quantum-holo-lens-runtime-contract.mjs               tests/business-qr-holo-lens-contract.mjs               tests/creator-revenue-fabric-contract.mjs               tests/creator-money-center-contract.mjs               tests/game-app-business-income-contract.mjs               tests/global-africa-payment-gateway-contract.mjs               tests/fraud-shield-contract.mjs               tests/payout-protection-contract.mjs               tests/all-american-omnichannel-commerce-contract.mjs               tests/all-american-omnichannel-center-contract.mjs               tests/quantum-source-logistics-contract.mjs               tests/holoverse-ecosystem-convergence-contract.mjs               tests/stubbs-lyons-middleverse-logistics-contract.mjs               tests/fleet-owner-operator-contract.mjs               tests/owner-operator-onboarding-accessorial-contract.mjs               tests/electric-drone-transport-contract.mjs               tests/streetverse-logistics-jobs-bridge-contract.mjs
            do
              if [ -f "$testfile" ]; then
                run_gate "$(basename "$testfile" .mjs)" node "$testfile"
              else
                echo "$(basename "$testfile" .mjs)=SKIP_MISSING" >> "$PASS_DIR/status.env"
              fi
            done

            # CrossVerse + CampusVerse + creator-flow discovery and bridge evidence.
            # CampusVerse exists today; CrossVerse remains a tracked convergence target
            # until the actual implementation lands on main.
            CROSSVERSE_MATCHES="$(grep -RilE "crossverse|cross-verse" src public tests 2>/dev/null | head -50 || true)"
            CAMPUSVERSE_MATCHES="$(grep -RilE "campusverse|campus-verse" src public tests 2>/dev/null | head -50 || true)"
            CREATOR_MATCHES="$(grep -RilE "omnibox|reels?|creator commerce|creator-commerce" src public tests 2>/dev/null | head -50 || true)"

            printf "%s\n" "$CROSSVERSE_MATCHES" > "$PASS_DIR/crossverse-files.txt"
            printf "%s\n" "$CAMPUSVERSE_MATCHES" > "$PASS_DIR/campusverse-files.txt"
            printf "%s\n" "$CREATOR_MATCHES" > "$PASS_DIR/creator-flow-files.txt"

            if [ -n "$CAMPUSVERSE_MATCHES" ]; then
              echo "campusverse_discovery=0" >> "$PASS_DIR/status.env"
            else
              echo "campusverse_discovery=1" >> "$PASS_DIR/status.env"
            fi

            if [ -n "$CROSSVERSE_MATCHES" ]; then
              echo "crossverse_discovery=0" >> "$PASS_DIR/status.env"
            else
              echo "crossverse_discovery=PENDING_WIRING" >> "$PASS_DIR/status.env"
              echo "- CrossVerse: PENDING_WIRING (no implementation found on this pass)" >> "$PASS_DIR/README.md"
            fi

            if [ -n "$CREATOR_MATCHES" ]; then
              echo "creator_flow_discovery=0" >> "$PASS_DIR/status.env"
            else
              echo "creator_flow_discovery=PENDING_WIRING" >> "$PASS_DIR/status.env"
            fi

            # When both verses exist, require evidence that they participate in the
            # shared creator/player graph rather than becoming disconnected mini-apps.
            if [ -n "$CROSSVERSE_MATCHES" ] && [ -n "$CAMPUSVERSE_MATCHES" ]; then
              BRIDGE_HITS="$(grep -RilE "player.?state|creator.?state|omnibox|reels?|passport|ledger|mission" $CROSSVERSE_MATCHES $CAMPUSVERSE_MATCHES 2>/dev/null | head -50 || true)"
              printf "%s\n" "$BRIDGE_HITS" > "$PASS_DIR/crossverse-campusverse-bridge-files.txt"
              if [ -n "$BRIDGE_HITS" ]; then
                echo "crossverse_campusverse_shared_state=0" >> "$PASS_DIR/status.env"
              else
                echo "crossverse_campusverse_shared_state=1" >> "$PASS_DIR/status.env"
              fi
            else
              echo "crossverse_campusverse_shared_state=PENDING_WIRING" >> "$PASS_DIR/status.env"
            fi

            if [ -f "public/streetverse-kingdom/index.html" ] &&
               [ -f "public/streetverse-kingdom/style.css" ] &&
               [ -f "public/streetverse-kingdom/01-core-world.js" ] &&
               [ -f "public/streetverse-kingdom/02-physics-traffic.js" ] &&
               [ -f "public/streetverse-kingdom/03-spawn-phone.js" ] &&
               [ -f "public/streetverse-kingdom/04-radial-input.js" ] &&
               [ -f "public/streetverse-kingdom/05-player-camera-hud.js" ] &&
               [ -f "public/streetverse-kingdom/06-loop.js" ] &&
               [ -f "public/streetverse-kingdom/tryamm-bridge.js" ]; then
              echo "kingdom_payload=0" >> "$PASS_DIR/status.env"
              grep -Eq "THREE|three" public/streetverse-kingdom/01-core-world.js || echo "kingdom_three=1" >> "$PASS_DIR/status.env"
              grep -Eq "driveCar|vehicle|car" public/streetverse-kingdom/02-physics-traffic.js || echo "kingdom_vehicle=1" >> "$PASS_DIR/status.env"
              grep -Eq "touch|pointer|controller|keyboard" public/streetverse-kingdom/04-radial-input.js || echo "kingdom_controls=1" >> "$PASS_DIR/status.env"
              grep -Eq "map|waypoint|phone" public/streetverse-kingdom/03-spawn-phone.js || echo "kingdom_navigation=1" >> "$PASS_DIR/status.env"
              if grep -q "/streetverse-kingdom/index.html" src/components/KingdomDistrictRoute.tsx; then
                echo "kingdom_route=0" >> "$PASS_DIR/status.env"
              else
                echo "kingdom_route=1" >> "$PASS_DIR/status.env"
              fi
            else
              echo "kingdom_payload=PENDING_IMPORT" >> "$PASS_DIR/status.env"
              echo "Canonical Kingdom payload is incomplete; one or more required production game files are missing." >> "$PASS_DIR/README.md"
            fi

            run_gate unreal-manifest npm run unreal:manifest
            run_gate unreal-readiness npm run unreal:check
            run_gate graphics-readiness npm run graphics:check
            run_gate omnifabric-readiness npm run omnifabric:check
            run_gate lens-readiness npm run lens:check
            run_gate revenue-fabric-readiness npm run revenue:check
            run_gate money-center-readiness npm run money-center:check
            run_gate business-income-readiness npm run business-income:check
            run_gate global-payments-readiness npm run global-payments:check
            run_gate fraud-shield-readiness npm run fraud:check
            run_gate payout-protection-readiness npm run payout-protection:check
            run_gate omnichannel-commerce-readiness npm run omnichannel:check
            run_gate omnichannel-center-readiness npm run omnichannel-center:check
            run_gate quantum-source-readiness npm run quantum-source:check
            run_gate holoverse-readiness npm run holoverse:check
            run_gate logistics-freight-readiness npm run logistics-freight:check
            run_gate fleet-owner-operator-readiness npm run fleet-owner-operator:check
            run_gate owner-operator-onboarding-readiness npm run owner-operator-onboarding:check
            run_gate electric-drone-transport-readiness npm run electric-drone-transport:check
            run_gate streetverse-logistics-readiness npm run streetverse-logistics:check
            run_gate business-revenue-readiness npm run business-revenue:check
            run_gate business-pricing-readiness npm run business-pricing:check
            run_gate domain-provisioning-readiness npm run domain-provisioning:check
            run_gate quantum-growth-readiness npm run quantum-growth:check
            run_gate kingdom-regression-readiness npm run kingdom:regression:check
            run_gate kingdom-googolplex-memory npm run kingdom:memory:capture
            run_gate typecheck npm run typecheck
            run_gate production-build npm run build

            git add -A src public vercel.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "continuous convergence pass $PASS: deterministic StreetVerse repairs"
              git push --force-with-lease origin "HEAD:refs/heads/$WORK_BRANCH"
              SOURCE_COMMITS=$((SOURCE_COMMITS+1))
              echo "source_repair_commit=$(git rev-parse HEAD)" >> "$PASS_DIR/status.env"
            fi

            FAILURES="$(awk -F= '$2 ~ /^[1-9][0-9]*$/ {print $1}' "$PASS_DIR/status.env" | tr '\n' ' ')"
            PENDING="$(awk -F= '$2 ~ /^PENDING_/ {print $1 "=" $2}' "$PASS_DIR/status.env" | tr '\n' ' ')"
            if [ -z "$FAILURES" ] && [ -z "$PENDING" ]; then
              GREEN_PASSES=$((GREEN_PASSES+1))
              echo "PASS_RESULT=GREEN" >> "$PASS_DIR/status.env"
              echo "- Result: GREEN" >> "$PASS_DIR/README.md"
              if [ "$BUILD_MODE" -eq 0 ]; then
                BUILD_MODE=1
                FIRST_GREEN_PASS=$PASS
                echo "- Convergence reached GREEN on pass $PASS; remaining engineering passes switch to BUILD MODE." >> ../release-evidence/streetverse-master/summary.md
              else
                BUILD_MODE_PASSES=$((BUILD_MODE_PASSES+1))
                echo "- BUILD MODE pass $PASS stayed GREEN after app/game work." >> ../release-evidence/streetverse-master/summary.md
              fi
            else
              RED_PASSES=$((RED_PASSES+1))
              echo "PASS_RESULT=RED" >> "$PASS_DIR/status.env"
              echo "- Result: RED" >> "$PASS_DIR/README.md"
              [ -n "$FAILURES" ] && echo "- Failed gates: $FAILURES" >> "$PASS_DIR/README.md"
              [ -n "$PENDING" ] && echo "- Pending gates: $PENDING" >> "$PASS_DIR/README.md"
              if [ "$BUILD_MODE" -eq 1 ]; then
                echo "- BUILD MODE found a regression/pending gate; continuing repairs on the next hourly pass." >> ../release-evidence/streetverse-master/summary.md
              fi
            fi

            echo "- Engineering pass $PASS: $(date -u -Iseconds), elapsed $ELAPSED_HOURS h" >> ../release-evidence/streetverse-master/summary.md

            if [ "$PASS" -lt "$PASSES" ]; then
              echo "- Waiting $INTERVAL_MINUTES minutes before the next engineering pass." >> ../release-evidence/streetverse-master/summary.md
              sleep "$((INTERVAL_MINUTES * 60))"
            fi
          done

          END_EPOCH=$(date +%s)
          TOTAL_SEC=$((END_EPOCH - START_EPOCH))
          TOTAL_MIN=$((TOTAL_SEC / 60))
          TOTAL_HOURS=$(awk "BEGIN {printf \"%.2f\", $TOTAL_MIN/60}")

          {
            echo
            echo "## Run totals"
            echo "- Completed UTC: $(date -u -Iseconds)"
            echo "- Tracked engineering window: $TOTAL_HOURS hours ($TOTAL_MIN minutes)"
            echo "- Engineering passes executed: $EXECUTED_PASSES of maximum $PASSES"
            echo "- Hourly interval target: $INTERVAL_MINUTES minutes"
            echo "- Green passes: $GREEN_PASSES"
            echo "- Red passes: $RED_PASSES"
            echo "- Source repair commits: $SOURCE_COMMITS"
            echo "- First GREEN pass: $FIRST_GREEN_PASS"
            echo "- BUILD MODE passes completed: $BUILD_MODE_PASSES"
            echo
            echo "This workflow is a bounded engineering session: one pass per hour for up to six passes. Once convergence is GREEN, remaining passes switch to BUILD MODE for app/game work and regression verification."
            echo "A CI cycle is engineering validation, not a claim of physical iPhone visual certification."
          } >> ../release-evidence/streetverse-master/summary.md

          echo "green_passes=$GREEN_PASSES" >> "$GITHUB_OUTPUT"
          echo "red_passes=$RED_PASSES" >> "$GITHUB_OUTPUT"
          echo "source_commits=$SOURCE_COMMITS" >> "$GITHUB_OUTPUT"
          echo "tracked_hours=$TOTAL_HOURS" >> "$GITHUB_OUTPUT"
          echo "executed_passes=$EXECUTED_PASSES" >> "$GITHUB_OUTPUT"
          echo "first_green_pass=$FIRST_GREEN_PASS" >> "$GITHUB_OUTPUT"
          echo "build_mode_passes=$BUILD_MODE_PASSES" >> "$GITHUB_OUTPUT"

      - name: Push repair branch state
        if: always()
        run: |
          git push --force-with-lease origin "HEAD:refs/heads/$WORK_BRANCH" || true

      - name: Open or reuse repair PR when source changed
        if: steps.converge.outputs.source_commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --head "$WORK_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Repair PR already open: #$EXISTING"
          else
            gh pr create               --base main               --head "$WORK_BRANCH"               --title "StreetVerse continuous convergence repairs"               --body "Recurring deterministic convergence for Kingdom city, Chicago/West Side, CrossVerse, CampusVerse, Reels/OmniBox creator flow, accessibility controls and production build. Review evidence before merge."
          fi

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## StreetVerse Master Continuous Convergence"
            echo
            echo "- Tracked hours this run: ${{ steps.converge.outputs.tracked_hours || '0' }}"
            echo "- Green passes: ${{ steps.converge.outputs.green_passes || '0' }}"
            echo "- Red passes: ${{ steps.converge.outputs.red_passes || '0' }}"
            echo "- Source repair commits: ${{ steps.converge.outputs.source_commits || '0' }}"
            echo "- CrossVerse + CampusVerse + Reels/OmniBox bridge is tracked every engineering pass."
            echo "- Runs as a bounded hourly engineering session: up to 6 passes; GREEN switches the remaining passes into BUILD MODE."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streetverse-master-continuous-${{ github.run_id }}
          path: release-evidence/streetverse-master/
          if-no-files-found: warn
          retention-days: 30
