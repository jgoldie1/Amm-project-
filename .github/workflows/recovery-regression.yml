name: Omniverse recovery regression
on: workflow_dispatch
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix amm-omniverse ci
      - run: npm --prefix amm-omniverse run build
      - run: python3 tools/recovery/verify.py regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: regression.json
