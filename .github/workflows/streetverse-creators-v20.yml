name: StreetVerse creators validation v20
on:
  push:
    paths:
      - 'streetverse-creator/**'
      - '.github/workflows/streetverse-creators-v20.yml'
  pull_request:
    paths:
      - 'streetverse-creator/**'
      - '.github/workflows/streetverse-creators-v20.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check streetverse-creator/validate.mjs
      - run: node streetverse-creator/validate.mjs streetverse-creator/examples/chicago-studio.json
