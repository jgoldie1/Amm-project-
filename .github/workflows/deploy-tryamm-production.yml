name: TRYAMM Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - developer-vic
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/deploy-tryamm-production.yml'

permissions:
  contents: read

concurrency:
  group: tryamm-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_whGr4qRPOF6jMCRuQZ3Kbnry
  VERCEL_PROJECT_ID: prj_pjc4m9dRB2WAWAtbkpyjpdhrJRFg

jobs:
  verify-stage-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: amm-omniverse

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: developer-vic
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Run application checks
        run: npm run check

      - name: Install backend dependencies
        working-directory: amm-omniverse/amm-backend
        run: npm ci --no-audit --no-fund

      - name: Run backend checks including Financial Truth
        working-directory: amm-omniverse/amm-backend
        run: npm run check

      - name: Require Vercel deployment token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing GitHub Actions secret: VERCEL_TOKEN"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build release candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy staged release candidate
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $PREVIEW_URL"

      - name: Verify exact staged deployment
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base=os.environ['PREVIEW_URL'].rstrip('/')
          paths=['/','/streetverse','/financial-truth']
          failures=[]
          for path in paths:
              url=base+path
              ok=False; last=None
              for _ in range(8):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'TRYAMM-Release-Candidate/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          print(path, r.status, r.geturl())
                          if 200 <= r.status < 400:
                              ok=True; break
                  except Exception as exc:
                      last=exc; time.sleep(5)
              if not ok: failures.append(f'{path}: {last}')
          if failures:
              print('STAGED RELEASE BLOCKED')
              for f in failures: print(' -',f)
              raise SystemExit(1)
          print('STAGED RELEASE GREEN')
          PY

      - name: Promote verified preview to production
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: vercel promote "$PREVIEW_URL" --yes --token="$VERCEL_TOKEN"

      - name: Verify public production routes and services
        id: proof
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, time, urllib.request
          targets=[
              ('home','https://tryamm.online/',False),
              ('streetverse','https://tryamm.online/streetverse',False),
              ('financial-truth','https://tryamm.online/financial-truth',False),
              ('convergence','https://tryamm.online/api/system/convergence',True),
              ('backend-health','https://amm-project-1-rpz9.onrender.com/api/health',True),
          ]
          results=[]; failures=[]
          for name,url,want_json in targets:
              ok=False; status=None; final_url=None; detail=None
              for _ in range(10):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'TRYAMM-Production-Proof/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          status=r.status; final_url=r.geturl(); body=r.read(250000).decode('utf-8','replace')
                          if want_json: json.loads(body)
                          if 200 <= r.status < 400: ok=True; break
                  except Exception as exc:
                      detail=str(exc); time.sleep(6)
              results.append({'gate':name,'url':url,'ok':ok,'status':status,'finalUrl':final_url,'error':detail})
              if not ok: failures.append(name)
          production_green=not failures
          proof={
              'schema':'tryamm.release-proof.v2',
              'commitSha':os.environ.get('EXPECTED_SHA'),
              'stagedDeployment':os.environ.get('PREVIEW_URL'),
              'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'productionGreen':production_green,
              'deviceProof':{
                  'status':'pending',
                  'required':True,
                  'reason':'A real phone/device smoke test has not yet been recorded for this SHA.'
              },
              'fullGreen':False,
              'gates':results,
          }
          with open('../tryamm-release-proof.json','w') as f: json.dump(proof,f,indent=2)
          print(json.dumps(proof,indent=2))
          if failures:
              print('PRODUCTION GREEN BLOCKED:', ', '.join(failures))
              raise SystemExit(1)
          print('PRODUCTION GREEN; DEVICE PROOF STILL REQUIRED FOR FULL GREEN')
          PY

      - name: Roll back failed promoted release
        if: failure() && steps.promote.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Post-promotion verification failed. Rolling production back to the previous deployment."
          vercel rollback --yes --token="$VERCEL_TOKEN"
          vercel rollback status --token="$VERCEL_TOKEN" || true

      - name: Verify service after rollback
        if: failure() && steps.promote.outcome == 'success'
        run: |
          python3 - <<'PY'
          import time, urllib.request
          targets=['https://tryamm.online/','https://tryamm.online/streetverse']
          failed=[]
          for url in targets:
              ok=False; last=None
              for _ in range(8):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'TRYAMM-Rollback-Proof/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          print(url, r.status, r.geturl())
                          if 200 <= r.status < 400:
                              ok=True; break
                  except Exception as exc:
                      last=exc; time.sleep(5)
              if not ok: failed.append(f'{url}: {last}')
          if failed:
              print('ROLLBACK RESTORATION NEEDS MANUAL ATTENTION')
              for item in failed: print(' -', item)
          else:
              print('ROLLBACK RESTORATION VERIFIED')
          PY

      - name: Upload release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryamm-release-proof-${{ github.sha }}
          path: tryamm-release-proof.json
          if-no-files-found: warn
          retention-days: 30
