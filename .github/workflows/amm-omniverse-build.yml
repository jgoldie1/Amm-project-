name: AMM Omniverse Build

on:
  pull_request:
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/amm-omniverse-build.yml'
  push:
    branches:
      - agent/website-recovery
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/amm-omniverse-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
