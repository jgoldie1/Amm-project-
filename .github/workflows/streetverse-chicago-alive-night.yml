name: StreetVerse Chicago Alive Night Shift

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Night-shift gate to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - alive-pass-1
          - visual-pass-2
          - visual-pass-3
          - traffic-pass-4
          - identity-interaction-pass-5
          - pedestrian-routines-pass-6
  push:
    branches:
      - feature/streetverse-chicago-alive-v2-20260928
      - feature/streetverse-chicago-visual-pass-3-20260928
      - feature/streetverse-chicago-traffic-life-pass-4-20260928
      - feature/streetverse-chicago-identity-interaction-pass-5-20260928
      - feature/streetverse-chicago-pedestrian-routines-pass-6-20260928
      - main
    paths:
      - 'amm-omniverse/src/components/StreetVerseMobileWorld.tsx'
      - 'amm-omniverse/src/runtime/StreetVerseChicagoAliveMobileRuntime.ts'
      - 'amm-omniverse/src/runtime/StreetVerseChicagoVisualLifeRuntime.ts'
      - 'amm-omniverse/src/runtime/StreetVerseChicagoTrafficLifeRuntime.ts'
      - 'amm-omniverse/src/runtime/StreetVerseChicagoIdentityInteractionRuntime.ts'
      - 'amm-omniverse/src/runtime/StreetVerseChicagoPedestrianRoutineRuntime.ts'
      - 'amm-omniverse/tests/streetverse-chicago-alive-contract.mjs'
      - 'amm-omniverse/tests/streetverse-chicago-visual-pass-3-contract.mjs'
      - 'amm-omniverse/tests/streetverse-chicago-traffic-life-pass-4-contract.mjs'
      - 'amm-omniverse/tests/streetverse-chicago-identity-interaction-pass-5-contract.mjs'
      - 'amm-omniverse/tests/streetverse-chicago-pedestrian-routines-pass-6-contract.mjs'
      - 'amm-omniverse/package.json'
      - '.github/workflows/streetverse-chicago-alive-night.yml'
  schedule:
    - cron: '15 3 28 9 *'
      timezone: 'America/Chicago'
    - cron: '30 6 28 9 *'
      timezone: 'America/Chicago'

permissions:
  contents: read

concurrency:
  group: streetverse-chicago-alive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alive-pass-1:
    if: github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'alive-pass-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install Omniverse dependencies
        run: npm ci
      - name: Chicago Alive focused contract
        run: node tests/streetverse-chicago-alive-contract.mjs
      - name: Type + lint + test gate
        run: npm run check
      - name: Report Alive Pass 1
        run: |
          echo "## StreetVerse Chicago Alive Pass 1 — GREEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- 28 additional instanced ambient residents wired" >> "$GITHUB_STEP_SUMMARY"
          echo "- 18 parked vehicles wired" >> "$GITHUB_STEP_SUMMARY"
          echo "- 16 storefront lights + 26 curb props + crosswalks wired" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mobile camera moved closer to gameplay" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mobile real-time shadows remain disabled for performance" >> "$GITHUB_STEP_SUMMARY"

  visual-pass-2:
    needs: alive-pass-1
    if: needs.alive-pass-1.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'visual-pass-2')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install Omniverse dependencies
        run: npm ci
      - name: Verify living-city performance contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "aliveDensity:'alive-v1'" src/components/StreetVerseMobileWorld.tsx
          grep -q "visualDensity:'chicago-visual-v2'" src/components/StreetVerseMobileWorld.tsx
          grep -q "ambientResidents:crowdCount" src/runtime/StreetVerseChicagoAliveMobileRuntime.ts
          grep -q "parkedVehicles:parkedPositions.length" src/runtime/StreetVerseChicagoAliveMobileRuntime.ts
          grep -q "crosswalkStripes:stripeIndex" src/runtime/StreetVerseChicagoAliveMobileRuntime.ts
          grep -q "renderer.shadowMap.enabled=false" src/components/StreetVerseMobileWorld.tsx
          echo "Living-city source budget PASS"
      - name: Re-run focused contract
        run: node tests/streetverse-chicago-alive-contract.mjs
      - name: Report Visual Pass 2
        run: |
          echo "## StreetVerse Chicago Visual Pass 2 — GREEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Living-city density contract: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mobile performance guard: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ready for exact-SHA production certification after merge to main" >> "$GITHUB_STEP_SUMMARY"

  visual-pass-3:
    needs: visual-pass-2
    if: needs.visual-pass-2.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'visual-pass-3')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install Omniverse dependencies
        run: npm ci
      - name: Chicago Visual Life focused contract
        run: node tests/streetverse-chicago-visual-pass-3-contract.mjs
      - name: Verify Visual Pass 3 mobile budget
        shell: bash
        run: |
          set -euo pipefail
          grep -q "visualLifeDensity:'chicago-visual-v3'" src/components/StreetVerseMobileWorld.tsx
          grep -q "renderer.shadowMap.enabled=false" src/components/StreetVerseMobileWorld.tsx
          grep -q "streetverse-mobile-facade-accents" src/runtime/StreetVerseChicagoVisualLifeRuntime.ts
          grep -q "streetverse-mobile-bus-shelter-roofs" src/runtime/StreetVerseChicagoVisualLifeRuntime.ts
          grep -q "streetverse-mobile-social-resident-bodies" src/runtime/StreetVerseChicagoVisualLifeRuntime.ts
          echo "Visual Pass 3 source budget PASS"
      - name: Report Visual Pass 3
        run: |
          echo "## StreetVerse Chicago Visual Pass 3 — GREEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Building facade accents + awnings: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Benches + bins + bus shelters + street signs: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Social resident clusters: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time-aware night visibility: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real-time phone shadow maps remain disabled" >> "$GITHUB_STEP_SUMMARY"

  traffic-pass-4:
    needs: visual-pass-3
    if: needs.visual-pass-3.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'traffic-pass-4')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install Omniverse dependencies
        run: npm ci
      - name: Chicago Traffic Life focused contract
        run: node tests/streetverse-chicago-traffic-life-pass-4-contract.mjs
      - name: Verify Traffic Pass 4 mobile budget
        shell: bash
        run: |
          set -euo pipefail
          grep -q "trafficLifeDensity:'chicago-traffic-v1'" src/components/StreetVerseMobileWorld.tsx
          grep -q "trafficObeysSignals:true" src/components/StreetVerseMobileWorld.tsx
          grep -q "streetverse-mobile-traffic-signal-heads" src/runtime/StreetVerseChicagoTrafficLifeRuntime.ts
          grep -q "getTrafficMultiplier" src/runtime/StreetVerseChicagoTrafficLifeRuntime.ts
          grep -q "renderer.shadowMap.enabled=false" src/components/StreetVerseMobileWorld.tsx
          echo "Traffic Pass 4 source budget PASS"
      - name: Report Traffic Pass 4
        run: |
          echo "## StreetVerse Chicago Traffic Pass 4 — GREEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- 9 signalized intersections: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- 36 lightweight traffic signal heads: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI traffic stop/go cycle: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vehicle heading matches travel direction: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Weather speed multiplier preserved: PASS" >> "$GITHUB_STEP_SUMMARY"

  identity-interaction-pass-5:
    needs: traffic-pass-4
    if: needs.traffic-pass-4.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'identity-interaction-pass-5')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install Omniverse dependencies
        run: npm ci
      - name: Chicago Identity Interaction focused contract
        run: node tests/streetverse-chicago-identity-interaction-pass-5-contract.mjs
      - name: Verify Identity Pass 5 mobile budget
        shell: bash
        run: |
          set -euo pipefail
          grep -q "chicagoIdentityPass:'v5'" src/components/StreetVerseMobileWorld.tsx
          grep -q "contextualInteraction:true" src/components/StreetVerseMobileWorld.tsx
          grep -q "streetverse-chicago-district-labels" src/runtime/StreetVerseChicagoIdentityInteractionRuntime.ts
          grep -q "streetverse-chicago-cta-identity" src/runtime/StreetVerseChicagoIdentityInteractionRuntime.ts
          grep -q "streetverse-chicago-lakefront-identity" src/runtime/StreetVerseChicagoIdentityInteractionRuntime.ts
          grep -q "renderer.shadowMap.enabled=false" src/components/StreetVerseMobileWorld.tsx
          echo "Identity Interaction Pass 5 source budget PASS"
      - name: Report Identity Interaction Pass 5
        run: |
          echo "## StreetVerse Chicago Identity + Interaction Pass 5 — GREEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chicago district identity markers: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- CTA + lakefront identity: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- START MISSION / SHOP / TALK / RIDE / EXPLORE prompts: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vehicle ENTER / EXIT prompt integration: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mobile shadow-map guard preserved" >> "$GITHUB_STEP_SUMMARY"

  pedestrian-routines-pass-6:
    needs: identity-interaction-pass-5
    if: needs.identity-interaction-pass-5.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.phase == 'all' || inputs.phase == 'pedestrian-routines-pass-6')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install Omniverse dependencies
        run: npm ci
      - name: Chicago Pedestrian Routines focused contract
        run: node tests/streetverse-chicago-pedestrian-routines-pass-6-contract.mjs
      - name: Verify Pedestrian Pass 6 mobile budget
        shell: bash
        run: |
          set -euo pipefail
          grep -q "pedestrianLifePass:'v6'" src/components/StreetVerseMobileWorld.tsx
          grep -q "pedestriansObeySignals:true" src/components/StreetVerseMobileWorld.tsx
          grep -q "streetverse-mobile-crossing-resident-bodies" src/runtime/StreetVerseChicagoPedestrianRoutineRuntime.ts
          grep -q "streetverse-mobile-pedestrian-walk-signals" src/runtime/StreetVerseChicagoPedestrianRoutineRuntime.ts
          grep -q "renderer.shadowMap.enabled=false" src/components/StreetVerseMobileWorld.tsx
          echo "Pedestrian Pass 6 source budget PASS"
      - name: Report Pedestrian Routines Pass 6
        run: |
          echo "## StreetVerse Chicago Pedestrian Routines Pass 6 — GREEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- 18 signal-aware crossing residents: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pedestrian walk/stop indicators: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commuter / shopper / delivery / visitor routines: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Crosswalk wait/cross behavior: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mobile instancing + shadow-map guard: PASS" >> "$GITHUB_STEP_SUMMARY"

  production-certification:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [alive-pass-1, visual-pass-2, visual-pass-3, traffic-pass-4, identity-interaction-pass-5, pedestrian-routines-pass-6]
    uses: ./.github/workflows/deploy-tryamm-production.yml
