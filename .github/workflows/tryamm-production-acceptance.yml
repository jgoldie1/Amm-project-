name: TRYAMM Production Authenticated Acceptance

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: Production URL to validate
        required: true
        default: https://tryamm.online

permissions:
  contents: read

concurrency:
  group: tryamm-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-acceptance
    defaults:
      run:
        working-directory: amm-omniverse
    env:
      RUN_PRODUCTION_ACCEPTANCE: '1'
      E2E_BASE_URL: ${{ inputs.production_url }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Require acceptance secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in E2E_SUPABASE_URL E2E_SUPABASE_PUBLISHABLE_KEY E2E_TEST_EMAIL E2E_TEST_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required in the production-acceptance environment"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Full repository gate
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production authenticated journey
        run: npx playwright test tests/e2e/production-authenticated.spec.ts --project=chromium

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryamm-production-acceptance-${{ github.sha }}
          path: |
            amm-omniverse/playwright-report
            amm-omniverse/test-results
          if-no-files-found: ignore
          retention-days: 30
