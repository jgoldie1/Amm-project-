name: TRYAMM Core Completion Gate

on:
  push:
    branches:
      - agent/completion-pathways
      - developer-vic
  pull_request:
    branches:
      - developer-vic

permissions:
  contents: read

concurrency:
  group: tryamm-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security → provider gates → readiness → persistence → typecheck → smoke/build
        run: npm run check
