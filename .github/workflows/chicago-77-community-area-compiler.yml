name: Chicago 77 Community Area Compiler

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number (1-11), seven areas per batch except final batch"
        required: true
        default: "1"
      retry_failed:
        description: "Retry failed areas from the selected batch"
        required: true
        default: "true"

permissions:
  contents: read

concurrency:
  group: chicago-77-${{ github.ref }}-${{ inputs.batch }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const batch = Number(process.env.BATCH)
          if (!Number.isInteger(batch) || batch < 1 || batch > 11) throw new Error('batch must be 1..11')
          const start = (batch - 1) * 7 + 1
          const ids = Array.from({length: Math.min(7, 78 - start)}, (_, i) => start + i)
          console.log('matrix=' + JSON.stringify({area: ids}))
          NODE
        env:
          BATCH: ${{ inputs.batch }}

  compile-area:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install Omniverse dependencies
        working-directory: amm-omniverse
        run: npm ci
      - name: Validate compiler source
        working-directory: amm-omniverse
        run: npx tsc --noEmit
      - name: Compile community area checkpoint
        shell: bash
        run: |
          mkdir -p chicago-77-results
          node <<'NODE'
          const fs = require('fs')
          const areaId = Number(process.env.AREA_ID)
          if (!Number.isInteger(areaId) || areaId < 1 || areaId > 77) process.exit(2)
          const result = {
            areaId,
            sha: process.env.GITHUB_SHA,
            status: 'foundation-validated',
            note: 'Compiler contract validated. Geographic generation requires authorized source passports.',
            certified: false
          }
          fs.writeFileSync(`chicago-77-results/area-${String(areaId).padStart(2,'0')}.json`, JSON.stringify(result, null, 2))
          NODE
        env:
          AREA_ID: ${{ matrix.area }}
      - name: Upload area checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chicago-area-${{ matrix.area }}-${{ github.sha }}
          path: chicago-77-results/
          retention-days: 30

  certification-summary:
    if: always()
    needs: [plan, compile-area]
    runs-on: ubuntu-latest
    steps:
      - name: Report batch result
        run: |
          echo "Chicago 77 batch ${{ inputs.batch }} completed."
          echo "This workflow validates compiler readiness only."
          echo "No area is marked certified until source provenance, navigation, collision, mobile performance, Living City, and Founder approval gates pass."
