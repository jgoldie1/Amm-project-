name: Jacobie Vision Business Security Audit
on:
  pull_request:
    paths:
      - 'sites/**'
      - 'lib/business-tenant-boundaries.js'
      - 'lib/business-tenant-records.js'
      - 'lib/business-network-registry.js'
      - 'lib/jacobie-security-service-catalog.js'
      - 'tests/business-tenant-boundaries.test.cjs'
      - 'tests/business-tenant-records.test.cjs'
      - 'tests/business-network-registry.test.cjs'
      - 'tests/jacobie-security-service-catalog.test.cjs'
      - 'scripts/jacobie-business-security-audit.cjs'
      - '.github/workflows/jacobie-business-security.yml'
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'lib/business-tenant-boundaries.js'
      - 'lib/business-tenant-records.js'
      - 'lib/business-network-registry.js'
      - 'lib/jacobie-security-service-catalog.js'
      - 'tests/business-tenant-boundaries.test.cjs'
      - 'tests/business-tenant-records.test.cjs'
      - 'tests/business-network-registry.test.cjs'
      - 'tests/jacobie-security-service-catalog.test.cjs'
      - 'scripts/jacobie-business-security-audit.cjs'
      - '.github/workflows/jacobie-business-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Passive owned-site audit
        run: node scripts/jacobie-business-security-audit.cjs
      - name: Business tenant isolation contracts
        run: node tests/business-tenant-boundaries.test.cjs && node tests/business-tenant-records.test.cjs && node tests/business-network-registry.test.cjs && node tests/jacobie-security-service-catalog.test.cjs
