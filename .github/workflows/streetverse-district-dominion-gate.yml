name: StreetVerse District Dominion Game Gate

on:
  pull_request:
    paths:
      - 'amm-omniverse/src/runtime/StreetVerseDistrictDominionEngine.ts'
      - 'amm-omniverse/src/components/StreetVerseDistrictDominionPanel.tsx'
      - 'amm-omniverse/src/components/StreetVerseDominionLauncher.tsx'
      - 'amm-omniverse/src/components/StreetVerseSafeWorld.tsx'
      - 'amm-omniverse/src/components/StreetVerseGeoSpawnBridge.tsx'
      - 'amm-omniverse/tests/streetverse-district-dominion-contract.mjs'
      - 'amm-omniverse/tests/e2e/streetverse-district-dominion.spec.ts'
      - 'amm-omniverse/playwright.district-dominion.config.ts'
      - '.github/workflows/streetverse-district-dominion-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: district-dominion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulated-city-and-territory:
    name: Original game modes + TypeScript + local production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Gameplay contracts
        run: node tests/streetverse-district-dominion-contract.mjs
      - name: TypeScript safety
        run: npm run typecheck
      - name: Build app locally without publishing
        run: npx vite build
      - name: Install temporary Playwright test runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.57.0
      - name: Install single test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise one-hand phone interactions on unpublished preview
        run: npx playwright test --config=playwright.district-dominion.config.ts --project=mobile-chromium --workers=1
        env:
          CI: 'true'
      - name: Report scope
        if: always()
        run: |
          echo 'Original, offline fictional district and civic construction game. Not GTA or SimCity intellectual property.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Vercel deployment, Supabase project billing, online score settlement, cross-platform publishing, asset streaming, payouts or physical territory ownership.' >> "$GITHUB_STEP_SUMMARY"
