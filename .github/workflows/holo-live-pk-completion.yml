name: Holo LIVE PK Completion Gate

on:
  schedule:
    - cron: '47 * 20-30 9 *'
    - cron: '47 * 1-3 10 *'
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/holographic-carousel
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/holo-live-pk-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holo-live-pk-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify carousel LIVE PK LiveKit Lottie integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RELEASE_DEADLINE: '2026-10-02'
      TZ: America/Chicago

    steps:
      - name: Check release window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          today="$(date +%F)"
          if [[ "$today" > "$RELEASE_DEADLINE" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Holo LIVE/PK convergence window closed after $RELEASE_DEADLINE." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "## Holo LIVE + PK Completion Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Date: $today" >> "$GITHUB_STEP_SUMMARY"
            echo "- Deadline: $RELEASE_DEADLINE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 24
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Keep feature branch synchronized with main
        if: steps.window.outputs.active == 'true' && github.ref == 'refs/heads/feature/holographic-carousel'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          behind="$(git rev-list --count HEAD..origin/main)"
          echo "- Behind main: $behind" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$behind" -ne 0 ]]; then
            echo "::error::Holographic carousel branch is $behind commit(s) behind main."
            exit 1
          fi

      - name: Install Omniverse dependencies
        if: steps.window.outputs.active == 'true'
        working-directory: amm-omniverse
        run: npm install --no-audit --no-fund

      - name: Verify streaming and Lottie dependencies
        if: steps.window.outputs.active == 'true'
        working-directory: amm-omniverse
        run: npm ls livekit-client livekit-server-sdk @lottiefiles/dotlottie-react lottie-web

      - name: Run Holo LIVE PK integration contract
        if: steps.window.outputs.active == 'true'
        working-directory: amm-omniverse
        run: node tests/holo-live-pk-integration-contract.mjs

      - name: Security and provider readiness
        if: steps.window.outputs.active == 'true'
        working-directory: amm-omniverse
        run: |
          npm run security
          npm run readiness

      - name: Typecheck
        if: steps.window.outputs.active == 'true'
        working-directory: amm-omniverse
        run: npm run typecheck

      - name: Full preservation smoke suite
        if: steps.window.outputs.active == 'true'
        working-directory: amm-omniverse
        run: npm run smoke

      - name: Production build
        if: steps.window.outputs.active == 'true'
        working-directory: amm-omniverse
        run: npm run build

      - name: Mark Holo LIVE PK gate green
        if: steps.window.outputs.active == 'true' && success()
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "### GREEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact head: `$sha`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Carousel → LIVE/PK → LiveKit → Lottie/Holo FX contract: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Security/readiness/typecheck/smoke/build: PASS" >> "$GITHUB_STEP_SUMMARY"
