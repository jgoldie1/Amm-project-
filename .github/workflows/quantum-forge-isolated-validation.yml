name: Quantum Forge isolated preview validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and static contracts
        run: |
          node tools/quantum-forge-core.test.mjs
          node tools/quantum-forge-pipeline.test.mjs
          node tools/quantum-forge-bridge.test.mjs
          node tools/quantum-forge-character.test.mjs
          node tools/quantum-forge-recovered-character.test.mjs
          node tools/quantum-forge-security.test.mjs
          node tools/quantum-forge-studio/character-lab.contract.test.mjs
      - name: Install isolated studio dependencies
        working-directory: tools/quantum-forge-studio
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build isolated studio
        working-directory: tools/quantum-forge-studio
        run: npm run build
