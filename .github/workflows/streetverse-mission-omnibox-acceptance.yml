name: StreetVerse Mission Cinema and Omni Box Acceptance
on:
  push:
    branches:
      - fix/omni-box-holodrama-cinematic-missions-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinema-and-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install locked dependencies, no untrusted scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify mission and Omni Box integration contracts
        run: node --test tests/streetverse-cinematics-omnibox-contract.test.mjs
      - name: TypeScript no-regression check
        run: npm run typecheck
      - name: Build production site with preserved routes
        run: npm run build
