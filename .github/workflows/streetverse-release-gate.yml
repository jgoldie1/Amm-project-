name: StreetVerse release gate
on:
  push:
    paths:
      - 'amm-omniverse/src/components/StreetVerse*.tsx'
      - 'amm-omniverse/src/runtime/StreetVerse*.ts'
      - 'amm-omniverse/tests/streetverse-*.mjs'
      - 'amm-omniverse/tests/bj-*.mjs'
      - 'amm-omniverse/package.json'
      - 'amm-omniverse/package-lock.json'
      - '.github/workflows/streetverse-release-gate.yml'
  pull_request:
    paths:
      - 'amm-omniverse/src/components/StreetVerse*.tsx'
      - 'amm-omniverse/src/runtime/StreetVerse*.ts'
      - 'amm-omniverse/tests/streetverse-*.mjs'
      - 'amm-omniverse/tests/bj-*.mjs'
      - 'amm-omniverse/package.json'
      - 'amm-omniverse/package-lock.json'
      - '.github/workflows/streetverse-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streetverse-release-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chicago integrated storefront and delivery contract
        run: node tests/streetverse-chicago-integrated-contract.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Verify vehicle interaction
        run: node tests/streetverse-vehicle-control-contract.mjs
      - name: Verify mission completion bridge
        run: node tests/streetverse-mobile-mission-completion-bridge-contract.mjs
      - name: Verify iPhone player journey
        run: node tests/streetverse-iphone-player-journey-contract.mjs
      - name: Verify whitelist authorization boundaries
        run: node tests/streetverse-whitelist-request-contract.mjs
      - name: Verify virtual warehouse interactions
        run: node tests/streetverse-warehouse-contract.mjs
      - name: Verify Holo FON NPC phone interactions
        run: node tests/streetverse-holofon-contract.mjs
      - name: Verify TRYAMM warehouse partner and order dispatch
        run: node tests/streetverse-warehouse-partner-contract.mjs
      - name: Test fulfillment pilot server
        run: node --test tests/streetverse-fulfillment-server.test.mjs
      - name: Test Holo Delivery integration
        run: node tests/streetverse-fulfillment-integration-contract.mjs
      - name: Test living-world NPC storefronts
        run: node tests/streetverse-living-stores-contract.mjs
      - name: Test warehouse to storefront Holo Delivery mission
        run: node tests/streetverse-holo-delivery-mission-contract.mjs
      - name: Shopping and delivery behavior
        run: node --test tests/streetverse-shopping-regression.mjs
      - name: Test 3D NPC storefront and shopping lifecycle
        run: node tests/streetverse-living-stores-3d-contract.mjs
      - name: Test ChronoVerse shopping and NPC interactions
        run: node tests/streetverse-chrono-shopping-contract.mjs
      - name: Test walkable store interiors and checkout bridge
        run: node tests/streetverse-interior-shopping-contract.mjs
      - name: Test living city NPC commerce director
        run: node tests/streetverse-living-city-commerce-contract.mjs
      - name: Test living city and ChronoVerse director
        run: node tests/streetverse-living-city-director-contract.mjs
      - name: Test BJ avatar wardrobe bridge
        run: node tests/streetverse-wardrobe-bridge-contract.mjs
      - name: Test Holo Delivery reducer transitions
        run: node tests/streetverse-holo-delivery-behavior.test.mjs
      - name: Test Chicago shop doorway and interior navigation
        run: node tests/streetverse-store-navigation.test.mjs
      - name: Test Chicago mission certification and reload regression
        run: node tests/streetverse-chicago-certification-contract.mjs
      - name: Test physical Chicago certification and store obstacles
        run: node tests/streetverse-chicago-physical-certification-contract.mjs
      - name: Test replay mission ledger and duplicate-reward protection
        run: node --test tests/streetverse-delivery-replay-regression.mjs
      - name: Test branded 3D parcel handoff regression
        run: node tests/streetverse-branded-parcel-contract.mjs
      - name: Verify Chicago delivery replay and duplicate reward guard
        run: node tests/streetverse-delivery-replay-contract.mjs
      - name: Verify continuous Chicago session and restaurant checkout
        run: node tests/streetverse-chicago-session-contract.mjs
      - name: Verify After Dark nightlife and sound integration
        run: node tests/streetverse-after-dark-test-contract.mjs
      - name: Execute life mission state-machine regression
        run: node tests/streetverse-life-actions-behavior.mjs
      - name: Verify life actions and mission route
        run: node tests/streetverse-life-actions-contract.mjs
      - name: Verify food and drink economy
        run: node tests/streetverse-food-economy-contract.mjs
      - name: Verify BJ rescue mission
        run: node tests/streetverse-bj-rescue-contract.mjs
      - name: Verify BJ injury reactions
        run: node tests/streetverse-bj-injury-reaction-contract.mjs
      - name: Verify BJ injury and After Dark consent contracts
        run: node tests/streetverse-bj-injury-after-dark-contract.mjs
      - name: Verify opt-in BJ haptics
        run: node tests/streetverse-bj-haptic-contract.mjs
      - name: Verify BJ organ overlay
        run: node tests/streetverse-bj-anatomy-contract.mjs
      - name: Verify BJ avatar contracts
        run: |
          node tests/bj-stubbs-photomatched-runtime-contract.mjs
          node tests/bj-mobile-visual-acceptance-contract.mjs
      - name: Build frontend
        run: npm run build
      - name: Inspect published BJ V12 skeletal rig
        run: node scripts/inspect-bj-glb-rig.mjs
