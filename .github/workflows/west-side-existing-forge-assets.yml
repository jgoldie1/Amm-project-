name: West Side Reuse Existing Assets Gate
on:
  push:
    branches: [fix/west-side-forger-existing-assets-visibility-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reuse-forged-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: amm-omniverse
    env:
      MESHY_API_KEY: ""
      HIGGSFIELD_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install reproducible locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Existing assets and world builder contract
        run: node --test tests/streetverse-existing-forge-bridge-contract.test.mjs tests/streetverse-cinematics-omnibox-contract.test.mjs
      - name: Compile TypeScript for game and builder
        run: npm run typecheck
      - name: Generate only TRYAMM owned native assets, no paid APIs
        run: npm run native:assets
      - name: Assert actual deliverable GLB files exist
        run: |
          test -s public/generated-assets/native/kit/tree.glb
          test -s public/generated-assets/native/kit/brick-building-module.glb
          test -s public/generated-assets/native/kit/tryamm-2027-sport-sedan.glb
          test -s public/generated-assets/native/kit/streetverse-hero-player.glb
      - name: Build web app using generated local GLBs
        run: npx vite build
