name: StreetVerse Mini City and BJ Medical Regression
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'amm-omniverse/src/runtime/StreetVerseMiniCity*.ts'
      - 'amm-omniverse/src/components/StreetVerseIntegrationTestHUD.tsx'
      - 'amm-omniverse/src/components/StreetVerseMobileWorld.tsx'
      - 'amm-omniverse/tests/streetverse-mini-city-trauma-integration.test.mjs'
      - '.github/workflows/streetverse-mini-city-medical.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute mini-city collision and medical dispatch regressions
        run: node --test tests/streetverse-mini-city-trauma-integration.test.mjs
      - name: TypeScript integration gate
        run: npm run typecheck
      - name: Production Vite build
        run: npm run build
