name: Green Slice Dependency Repair

on:
  push:
    branches:
      - agent/green-slice-recovery-20261114
    paths:
      - .github/workflows/green-slice-dependency-repair.yml

permissions:
  contents: write

jobs:
  repair-production-lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/green-slice-recovery-20261114
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Verify current locked install
        run: npm --prefix amm-omniverse ci

      - name: Repair production dependency lockfile without force
        working-directory: amm-omniverse
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --omit=dev
          set -e

      - name: Verify repaired locked install
        run: npm --prefix amm-omniverse ci

      - name: Require zero moderate-or-higher production advisories
        working-directory: amm-omniverse
        run: npm audit --omit=dev --audit-level=moderate

      - name: Security contracts after dependency repair
        run: npm --prefix amm-omniverse run security

      - name: Typecheck after dependency repair
        run: npm --prefix amm-omniverse run typecheck

      - name: Commit only repaired Omniverse lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- amm-omniverse/package-lock.json; then
            echo "No lockfile repair was necessary."
            exit 0
          fi
          if ! git diff --quiet -- . ':(exclude)amm-omniverse/package-lock.json'; then
            echo "Unexpected files changed; refusing automated commit."
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amm-omniverse/package-lock.json
          git commit -m "security(deps): repair production dependency advisories"
          git push origin HEAD:agent/green-slice-recovery-20261114
