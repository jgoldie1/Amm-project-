name: BJ shirt RP regression
on:
  push:
    branches: [fix/bj-shirt-identity]
  pull_request:
    paths:
      - 'amm-omniverse/public/streetverse-kingdom/**'
      - 'amm-omniverse/tests/rp-action-search-bj-regression-contract.mjs'
      - '.github/workflows/bj-shirt-rp-regression.yml'
permissions:
  contents: read
jobs:
  rp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run actual BJ RP regression contract
        working-directory: amm-omniverse
        run: node tests/rp-action-search-bj-regression-contract.mjs
