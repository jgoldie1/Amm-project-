name: Holographic Carousel Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/holographic-carousel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holographic-carousel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify holographic carousel
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Install Omniverse dependencies
        working-directory: amm-omniverse
        run: npm ci

      - name: Require real carousel implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f amm-omniverse/src/components/HoloClipScreenLayer.tsx
          test -f amm-omniverse/src/holo/holoClip2.ts
          grep -q "Holographic carousel" amm-omniverse/src/components/HoloClipScreenLayer.tsx
          grep -q "HOLOGRAPHIC_CAROUSEL_PANELS" amm-omniverse/src/holo/holoClip2.ts
          echo "Holographic carousel implementation found."

      - name: Typecheck carousel integration
        working-directory: amm-omniverse
        run: npm run typecheck

      - name: Run security and readiness gates
        working-directory: amm-omniverse
        run: |
          npm run security
          npm run readiness

      - name: Build production Omniverse bundle
        working-directory: amm-omniverse
        run: npm run build

      - name: Run carousel-focused tests when present
        shell: bash
        run: |
          set -euo pipefail
          tests="$(find amm-omniverse -type f \( -iname '*carousel*.test.*' -o -iname '*carousel*.spec.*' -o -iname '*holo*clip*.test.*' -o -iname '*holo*clip*.spec.*' \) -not -path '*/node_modules/*' -print)"
          if [ -n "$tests" ]; then
            echo "$tests"
            npm --prefix amm-omniverse run smoke
          else
            echo "::notice::No carousel-specific test file yet; typecheck/security/readiness/build remain mandatory."
          fi
