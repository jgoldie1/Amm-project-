name: Recover BJ V15 original GLB
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'amm-omniverse/api/streetverse/bj-v15-model.js'
      - '.github/workflows/bj-v15-original-model-recovery.yml'
permissions:
  contents: read
jobs:
  bj-v15:
    name: Check and preserve original BJ V15 source asset
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout BJ V15 offline viewer source
        uses: actions/checkout@v5
      - name: Fetch exact owner-approved V15 GLB from stored source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3HqgexuZuGoTDUJ2Hxg2e6x5Hzm/daa5234c-5fbf-4b52-9c45-e82e36156153.glb'
          req = urllib.request.Request(url, headers={'User-Agent': 'StreetVerse-BJ-V15-Asset-Recovery/1.0','Accept': 'model/gltf-binary,application/octet-stream'})
          with urllib.request.urlopen(req, timeout=28) as stream:
              data = stream.read(64*1024*1024+1)
          if len(data) > 64*1024*1024: raise RuntimeError('Original V15 asset exceeds safe recovery size')
          if len(data) < 20 or data[:4] != b'glTF': raise RuntimeError('Source does not contain a binary GLB')
          if int.from_bytes(data[8:12], 'little') != len(data): raise RuntimeError('GLB declared length differs from received content')
          out = pathlib.Path('bj-v15-original')
          out.mkdir(exist_ok=True)
          (out/'BJ_STUBBS_V15_ACTING_FACE_LOOK_NOD.glb').write_bytes(data)
          metadata = {'filename':'BJ_STUBBS_V15_ACTING_FACE_LOOK_NOD.glb','sizeBytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'origin':'owner-designated-2026-streetverse-v15','likenessCertified':False,'gameplayVerified':False}
          (out/'MODEL_SOURCE.json').write_text(json.dumps(metadata, indent=2))
          print('BJ V15 ORIGINAL GLB RECOVERED: '+json.dumps(metadata))
          PY
      - name: Make original BJ GLB downloadable from GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: bj-stubbs-v15-original-model
          path: bj-v15-original/
          if-no-files-found: error
          retention-days: 14
      - name: Install Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Three.js and local viewer bundler
        working-directory: amm-omniverse
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bundle Three.js and embed the original BJ GLB for file-open Chrome playback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bj-v15-playable
          cd amm-omniverse
          ./node_modules/.bin/esbuild tools/bj-v15-offline/viewer.js --bundle --minify --format=iife --platform=browser --target=es2020 --outfile=../bj-v15-playable/viewer.bundle.js
          cd ..
          python3 - <<'PY'
          import base64,pathlib
          source=pathlib.Path('bj-v15-original/BJ_STUBBS_V15_ACTING_FACE_LOOK_NOD.glb').read_bytes()
          template=pathlib.Path('amm-omniverse/tools/bj-v15-offline/index.template.html').read_text()
          assert template.count('__BJ_ORIGINAL_BASE64__')==1
          page=template.replace('__BJ_ORIGINAL_BASE64__',base64.b64encode(source).decode('ascii'))
          pathlib.Path('bj-v15-playable/index.html').write_text(page)
          print('BJ V15 OFFLINE PLAYABLE PACKAGE:',len(page),'HTML characters, with embedded original GLB')
          PY
          test -s bj-v15-playable/viewer.bundle.js
          test -s bj-v15-playable/index.html
      - name: Provide offline BJ V15 playable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bj-stubbs-v15-offline-playable
          path: bj-v15-playable/
          if-no-files-found: error
          retention-days: 14
