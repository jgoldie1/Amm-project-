name: StreetVerse Storage 402 Native Fallback

on:
  pull_request:
    paths:
      - 'amm-omniverse/src/runtime/StreetVerseMeshyCharacterRuntime.ts'
      - 'amm-omniverse/tests/e2e/streetverse-supabase-outage-fallback.spec.ts'
      - '.github/workflows/streetverse-storage-402-native-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streetverse-storage-402-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-people-on-supabase-outage:
    name: Preserve visible 3D characters without storage service
    runs-on: ubuntu-latest
    timeout-minutes: 17
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck fallback semantics
        run: npm run typecheck
      - name: Prebuild owned native resident GLBs
        run: npm run assets:prebuild
      - name: Build preview locally without a Vercel deployment
        run: npx vite build
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.57.0
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Simulate Supabase 402 and verify native 3D resident stays in-game
        run: npx playwright test tests/e2e/streetverse-supabase-outage-fallback.spec.ts --project=mobile-chromium --workers=1 --reporter=line
        env:
          CI: 'true'
      - name: Report tested scope
        if: always()
        run: |
          echo 'Proof targets local generated native resident GLBs while simulated Supabase storage returns HTTP 402.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It does NOT restore Supabase access or prove BJ V15 likeness. No provider billing, migration, destructive data action or Vercel deployment is triggered.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streetverse-402-fallback-evidence
          path: |
            amm-omniverse/test-results
            amm-omniverse/playwright-report
          retention-days: 3
