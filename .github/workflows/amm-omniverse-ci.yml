name: amm-omniverse-ci

on:
  push:
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/amm-omniverse-ci.yml'
  pull_request:
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/amm-omniverse-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            amm-omniverse/package-lock.json
            amm-omniverse/amm-backend/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-fund --no-audit
      - name: Verify repository security and release contracts
        run: npm run check
      - name: Install backend dependencies
        run: npm ci --no-fund --no-audit
        working-directory: amm-omniverse/amm-backend
      - name: Verify backend LIVE, security and API contracts
        run: npm run check
        working-directory: amm-omniverse/amm-backend
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: amm-omniverse/playwright-report
          if-no-files-found: ignore
          retention-days: 7
