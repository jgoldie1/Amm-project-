name: TRYAMM Promote Frozen Release

on:
  workflow_dispatch:
  push:
    branches: [developer-vic]
    paths:
      - '.github/workflows/tryamm-promote-frozen-release.yml'

permissions:
  contents: read

env:
  VERCEL_SCOPE: jgoldie1s-projects
  FROZEN_SHA: 74b5b6850465ebd01a84d22eee16d9b518f71351
  FROZEN_DEPLOYMENT: https://amm-omniverse-lt3mmyqo2-jgoldie1s-projects.vercel.app

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Promote exact READY preview to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel promote "$FROZEN_DEPLOYMENT" --yes --timeout 5m --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          vercel promote status --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" || true

      - name: Verify public release SHA
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected=os.environ['FROZEN_SHA']
          url='https://tryamm.online/api/system/release'
          last=None
          for _ in range(18):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'TRYAMM-Frozen-Promotion/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=json.loads(r.read().decode())
                  actual=payload.get('commitSha')
                  print('Expected:', expected)
                  print('Production:', actual)
                  if actual == expected:
                      print('TRYAMM FROZEN RELEASE LIVE')
                      raise SystemExit(0)
                  last=f'expected {expected}, got {actual}'
              except Exception as exc:
                  last=str(exc)
              time.sleep(5)
          raise SystemExit('Frozen release promotion verification failed: '+str(last))
          PY
