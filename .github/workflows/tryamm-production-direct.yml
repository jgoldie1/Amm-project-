name: TRYAMM Production Direct

on:
  workflow_dispatch:
  push:
    branches: [developer-vic]
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/tryamm-production-direct.yml'

permissions:
  contents: read

concurrency:
  group: tryamm-production-direct
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_whGr4qRPOF6jMCRuQZ3Kbnry
  VERCEL_PROJECT_ID: prj_pjc4m9dRB2WAWAtbkpyjpdhrJRFg

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: amm-omniverse

    steps:
      - name: Checkout developer-vic
        uses: actions/checkout@v4
        with:
          ref: developer-vic
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Validate and build app
        run: |
          npm run smoke
          npm run build

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production project configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TRYAMM_RELEASE_SHA: ${{ github.sha }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production release
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROD_URL=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
          echo "Production: $PROD_URL"

      - name: Verify production exact SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected=os.environ['EXPECTED_SHA']
          url='https://tryamm.online/api/system/release'
          last=None
          for _ in range(12):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'TRYAMM-Production-Direct/1.0'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      payload=json.loads(r.read().decode())
                  actual=payload.get('commitSha')
                  print('Expected:', expected)
                  print('Production:', actual)
                  if actual == expected:
                      print('TRYAMM PRODUCTION SHA MATCH')
                      raise SystemExit(0)
                  last=f'expected {expected}, got {actual}'
              except Exception as exc:
                  last=str(exc)
              time.sleep(5)
          raise SystemExit('Production SHA verification failed: '+str(last))
          PY
