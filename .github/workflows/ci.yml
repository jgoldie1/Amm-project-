name: TryAMM Full CI

on:
  workflow_dispatch:
  push:
    branches: [main, developer-vic, foundation/aaa-golden-order-world-rollout]
  pull_request:
    branches: [main, developer-vic]

concurrency:
  group: tryamm-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root-platform:
    name: Root platform checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Root lint
        run: npm run lint

      - name: Root syntax
        run: npm run syntax

      - name: Root smoke tests
        run: npm test

      - name: CI release boundary contract
        run: node test/ci-release-boundary-contract.mjs

  omniverse-app:
    name: Omniverse app checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Install Omniverse dependencies
        run: npm install --no-audit --no-fund

      - name: Omniverse lint
        run: npm run lint

      - name: Omniverse security scan
        run: npm run security

      - name: Omniverse readiness and provider gates
        run: npm run readiness

      - name: Omniverse typecheck
        run: npm run typecheck

      - name: Repair StreetVerse entry
        run: node scripts/repair-streetverse-entry.mjs

      - name: Inject StreetVerse hero spawn
        run: node scripts/inject-streetverse-hero-spawn.mjs

      - name: Omniverse legacy smoke contracts
        run: |
          node tests/smoke-contracts.mjs
          node tests/living-world-recovery-contract.mjs
          node tests/command-nexus-accessibility-contract.mjs
          node tests/streetverse-economy-contract.mjs
          node tests/streetverse-visible-loop-contract.mjs
          node tests/streetverse-control-deck-contract.mjs
          node tests/asset-rights-contract.mjs
          node tests/network-fast-xr-contract.mjs
          node tests/streetverse-webxr-contract.mjs
          node tests/aniyah-pay-contract.mjs
          node tests/secs-construct-contract.mjs
          node tests/mobility-blockchain-contract.mjs
          node tests/omniverse-event-fabric-contract.mjs
          node tests/performance-release-contract.mjs
          node tests/biometric-avatar-privacy-contract.mjs
          node tests/streetverse-vehicle-control-contract.mjs
          node tests/streetverse-mobile-resident-conversation-contract.mjs
          node tests/holo-forge-contract.mjs
          node tests/streetverse-mobile-living-city-contract.mjs
          node tests/poyo-holosocial-lazy-contract.mjs
          node tests/streetverse-self-healing-contract.mjs
          node tests/streetverse-journey-qa-contract.mjs

      - name: Foundation commerce and Illinois release contracts
        run: |
          node tests/aaa-commerce-foundation-contract.mjs
          node tests/founder-commerce-telemetry-contract.mjs
          node tests/founder-commerce-telemetry-performance-cap-contract.mjs
          node tests/founder-commerce-telemetry-event-registry-contract.mjs
          node tests/founder-commerce-telemetry-serialization-contract.mjs
          node tests/golden-order-event-bridge-contract.mjs
          node tests/illinois-rollout-gate-contract.mjs
          node tests/illinois-rollout-performance-cap-contract.mjs
          node tests/illinois-rollout-serialization-contract.mjs

      - name: Vision-assisted AAA QA release contracts
        run: |
          node tests/vision-qa-foundation-contract.mjs
          node tests/vision-qa-release-gate-contract.mjs
          node tests/vision-qa-findings-performance-contract.mjs
          node tests/vision-qa-inspected-area-sparse-contract.mjs
          node tests/vision-qa-evidence-refs-sparse-contract.mjs

      - name: Foundation expansion domain contracts
        run: |
          node tests/farmer-motion-tracker-foundation-contract.mjs
          node tests/industrial-operations-foundation-contract.mjs
          node tests/epic-training-certification-contract.mjs
          node tests/drone-operations-foundation-contract.mjs
          node tests/stays-agency-family-foundation-contract.mjs
          node tests/stays-agency-family-persistence-contract.mjs
          node tests/platform-expansion-foundation-contract.mjs
          node tests/three-layer-blockchain-contract.mjs

      - name: Production bible persistence contracts
        run: |
          node tests/production-bible-foundation-contract.mjs
          node tests/production-bible-persistence-contract.mjs

      - name: Main synchronization and authoritative reward contracts
        run: |
          node tests/main-sync-preflight-contract.mjs
          node tests/streetverse-authoritative-reward-contract.mjs

      - name: Omniverse Vite production build
        run: npx vite build

  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs: [root-platform, omniverse-app]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm both validation lanes passed
        env:
          ROOT_RESULT: ${{ needs.root-platform.result }}
          OMNIVERSE_RESULT: ${{ needs.omniverse-app.result }}
        run: |
          echo "Root platform: $ROOT_RESULT"
          echo "Omniverse app: $OMNIVERSE_RESULT"
          test "$ROOT_RESULT" = "success"
          test "$OMNIVERSE_RESULT" = "success"
          echo "TryAMM release gate is GREEN"

  production-deploy:
    name: Production deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [release-gate]
    uses: ./.github/workflows/deploy-tryamm-production.yml
    secrets: inherit