name: StreetVerse Visual Evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'amm-omniverse/src/components/StreetVerse**'
      - 'amm-omniverse/src/data/StreetVerse**'
      - 'amm-omniverse/src/data/TryammNative**'
      - 'amm-omniverse/src/runtime/StreetVerse**'
      - 'amm-omniverse/scripts/tryamm-native-asset-foundry.mjs'
      - 'amm-omniverse/tests/e2e/streetverse-visual-evidence.spec.ts'
      - '.github/workflows/streetverse-visual-evidence.yml'

permissions:
  contents: read

concurrency:
  group: streetverse-visual-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-visual-proof:
    name: Phone visual proof — Circle Park + joystick + DRIVE
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native assets
        run: npm run native:assets

      - name: Build visual candidate
        run: npx vite build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture mobile StreetVerse visual evidence
        run: npx playwright test tests/e2e/streetverse-visual-evidence.spec.ts --project=mobile-chromium --reporter=line

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streetverse-mobile-visual-evidence-${{ github.sha }}
          path: |
            amm-omniverse/test-results/
            amm-omniverse/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize proof
        if: success()
        run: |
          {
            echo '## StreetVerse phone visual proof'
            echo
            echo '- Circle Park / StreetVerse canvas rendered'
            echo '- Always-visible joystick rendered'
            echo '- DRIVE action rendered'
            echo '- Vehicle entry reached DRIVING state'
            echo '- On-foot and driving screenshots uploaded as artifacts'
          } >> "$GITHUB_STEP_SUMMARY"
