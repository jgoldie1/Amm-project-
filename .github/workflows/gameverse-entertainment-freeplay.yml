name: GameVerse Entertainment Free-play
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'amm-omniverse/src/runtime/GameVerseEntertainmentDistrict.*'
      - 'amm-omniverse/src/components/GameVerseEntertainmentDistrict.tsx'
      - 'amm-omniverse/src/components/GameVerseHub.tsx'
      - 'amm-omniverse/tests/gameverse-entertainment-freeplay.test.mjs'
      - 'amm-omniverse/src/runtime/GameVerseSpadesTrick.*'
      - 'amm-omniverse/src/components/GameVerseSpadesPractice.tsx'
      - 'amm-omniverse/tests/gameverse-spades-practice.test.mjs'
      - 'amm-omniverse/scripts/gameverse-release-evidence.mjs'
      - '.github/workflows/gameverse-entertainment-freeplay.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/gameverse-entertainment-freeplay.test.mjs tests/gameverse-spades-practice.test.mjs
      - name: Export source-and-launch audit
        run: node scripts/gameverse-release-evidence.mjs ../release-evidence/gameverse.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameverse-evidence-json
          path: release-evidence/gameverse.json
          if-no-files-found: warn
          retention-days: 30
      - run: npm run typecheck
      - run: npm run build
