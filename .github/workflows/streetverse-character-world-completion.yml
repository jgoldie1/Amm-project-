name: BJ Rig and Circle Park West Side Completion Gate

on:
  workflow_dispatch:
  push:
    branches: [fix/character-world-completion, main]
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/streetverse-character-world-completion.yml'
  pull_request:
    paths:
      - 'amm-omniverse/**'
      - '.github/workflows/streetverse-character-world-completion.yml'

permissions:
  contents: read

concurrency:
  group: character-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Generate world kit and verify locked BJ rig
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test missing and corrupt rig rejection
        run: node --test tests/streetverse-completion-gate.test.mjs
      - name: Rebuild Circle Park and West Side native assets
        run: npm run native:assets
      - name: Verify actual GLBs, skin bindings, clips and checksums
        run: node scripts/streetverse-completion-gate.mjs
      - name: Preserve generated kit, BJ copy and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bj-circle-park-west-side-${{ github.sha }}
          path: release-evidence/character-world/
          if-no-files-found: error
          retention-days: 90
  gameplay:
    name: Gameplay contracts and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Circle Park, West Side, rig pipeline and one-hand contracts
        run: |
          set -euo pipefail
          node --test tests/streetverse-west-side-lifecycle.test.mjs tests/meshy-factory-client.test.mjs
          node tests/circle-park-chicago-completion-contract.mjs
          node tests/circle-park-west-side-jefferson-emergency-contract.mjs
          node tests/west-side-school-day-emergency-missions-contract.mjs
          node tests/meshy-rig-animation-pipeline-contract.mjs
          node tests/streetverse-bj-v15-real-model-visibility-contract.mjs
          node tests/tryamm-native-runtime-asset-contract.mjs
          node tests/streetverse-mobile-control-reliability-contract.mjs
          node tests/streetverse-one-hand-integration-contract.mjs
      - run: npm run typecheck
      - name: Explain gate scope
        if: always()
        run: |
          echo 'Source contracts and TypeScript are regression checks. They do not certify facial likeness, visual quality or physical iPhone gameplay. See the asset job report for outstanding review.' >> "$GITHUB_STEP_SUMMARY"
