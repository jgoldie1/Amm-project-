name: TRYAMM Release Preservation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preserve-critical-release-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify critical TRYAMM modules and loaders
        working-directory: amm-omniverse
        run: node scripts/check-release-preservation.mjs
