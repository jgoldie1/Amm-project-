name: StarVerse Phone Browser Wiring Test

on:
  pull_request:
    paths:
      - 'amm-omniverse/src/runtime/StarVerseCreatorOperations.ts'
      - 'amm-omniverse/src/components/StarVerseCreatorOperationsPanel.tsx'
      - 'amm-omniverse/src/components/StarVerseNetworkStudio.tsx'
      - 'amm-omniverse/tests/e2e/starverse-creator-ops.spec.ts'
      - '.github/workflows/starverse-creator-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starverse-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-browser:
    name: Chromium mobile rendering and click journey
    runs-on: ubuntu-latest
    timeout-minutes: 17
    defaults:
      run:
        working-directory: amm-omniverse
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amm-omniverse/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build a local preview without release / Vercel deployment
        run: npx vite build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Test phone click path on built app
        run: npx playwright test tests/e2e/starverse-creator-ops.spec.ts --project=mobile-chromium --workers=1
        env:
          CI: 'true'
      - name: Report scope
        if: always()
        run: |
          echo 'Chromium mobile emulation only; actual iPhone Safari and external streaming/payment providers remain untested.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Local Vite preview, no Vercel deployment. No media, advertising, casting or purchases are activated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starverse-phone-browser-evidence
          path: |
            amm-omniverse/test-results
            amm-omniverse/playwright-report
          retention-days: 3
