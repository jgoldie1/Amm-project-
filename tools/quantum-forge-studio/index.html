<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quantum Forge 8.0 Creator Studio</title><style>body{margin:0;background:#101020;color:#fff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:18px}button,input{font:inherit}button{padding:12px;border-radius:10px;cursor:pointer;background:#8665f3;color:white;border:0}label{display:grid;gap:4px}input{width:100%;box-sizing:border-box}#controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}canvas{width:100%;height:420px;background:#242438;border-radius:14px;touch-action:pan-y}section{margin:16px 0}small{color:#ddd}#status{min-height:24px}</style><main><h1>Quantum Forge 8.0</h1><p>Independent, experimental 3D creator studio. Nothing here changes your production StreetVerse game.</p><section><label>Describe a building<input id="prompt" value="three-story mansion"></label><button id="generate">Create geometry</button> <button id="stl">Export STL</button> <button id="xr">Check AR / VR</button></section><section id="controls"></section><section><label>Import GLB for visual inspection<input id="glb" type="file" accept=".glb,model/gltf-binary"></label><label>Import image for relief model<input id="image" type="file" accept="image/*"></label></section><canvas id="view" aria-label="Interactive 3D model preview"></canvas><p id="status" role="status" aria-live="polite">Ready. Drag to rotate the view.</p><small>Prototype: text-to-geometry uses rules, not generative AI. Print exports require independent slicer and physical checks. GLB import is view-only.</small></main><script type="module" src="./studio.mjs"></script></html>
