<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABLA Time Machine Prototype</title><style>body{margin:0;background:#17212b;color:white;font:18px system-ui}header{padding:16px}button{font:inherit;padding:14px;margin:4px;border-radius:10px}canvas{width:100%;height:60vh;background:#91b6cb}p{max-width:65ch}</style><header><h1>ABLA Time Machine</h1><button id="past">1938</button><button id="now">Present-day concept</button><button id="left">Move left</button><button id="right">Move right</button><p id="status" aria-live="polite"></p></header><canvas id="c" width="1000" height="600" aria-label="Conceptual neighborhood block"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d'),s=document.getElementById('status');let era=1938,x=0;function draw(){g.clearRect(0,0,1000,600);g.fillStyle='#73946a';g.fillRect(0,330,1000,270);g.fillStyle='#666';g.fillRect(0,490,1000,110);for(let i=0;i<5;i++){let a=i*225-100-x,b=era===1938?180:110+(i%3)*35;g.fillStyle=era===1938?'#925f49':'#c4b49b';g.fillRect(a,330-b,180,b);g.fillStyle='#293c49';for(let r=0;r<Math.floor(b/40);r++)for(let j=0;j<4;j++)g.fillRect(a+12+j*42,340-b+r*38,22,25)}g.fillStyle='#f7d77b';g.beginPath();g.arc(500,510,12,0,7);g.fill();s.textContent=(era===1938?'1938 Jane Addams Homes concept':'Present-day ABLA concept')+' — illustrative placeholder geometry, not a verified historical reconstruction. Position '+x;}document.getElementById('past').onclick=()=>{era=1938;draw()};document.getElementById('now').onclick=()=>{era=2026;draw()};document.getElementById('left').onclick=()=>{x-=25;draw()};document.getElementById('right').onclick=()=>{x+=25;draw()};draw();
</script></html>
