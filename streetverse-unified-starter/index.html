<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreetVerse | Playable Chicago Mission Baseline</title>
<style>
:root{color-scheme:dark}body{margin:0;font:16px system-ui;background:#101827;color:#f5f6ff}header{padding:12px 16px;background:#202845}h1{font-size:1.2rem;margin:0}p{margin:6px 0}main{max-width:950px;margin:auto;padding:12px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#182b3a;border:2px solid #6577a9;border-radius:12px;touch-action:none}#hud{margin:10px 0;min-height:2.8em}button{font-size:17px;min-height:50px;min-width:60px;background:#394777;color:white;border:1px solid #99aef6;border-radius:10px;cursor:pointer}button:focus-visible{outline:3px solid #fff}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}#diagnostics{font-size:13px;color:#c6cae9}a{color:#aceaff}
</style>
<header><h1>StreetVerse • Chicago Mission Baseline</h1><p>One player • one vehicle • one NPC • one mission • offline HTML</p></header>
<main><canvas id="game" width="960" height="540" aria-label="StreetVerse top-down mission scene"></canvas><p id="hud" role="status" aria-live="polite">Loading...</p>
<div class="controls"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button><button id="interact">INTERACT (E)</button><button id="reset">RESET</button></div>
<p id="diagnostics">Keyboard: arrows/WASD to move, E to interact. Touch controls and standard gamepad supported. This is a 2D gameplay baseline, not the finished BJ GLB 3D scene.</p></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),hud=document.querySelector('#hud');
const keys=new Set(),W=960,H=540;
const initial=()=>({x:92,y:365,carX:390,carY:365,driving:false,step:0,xp:0});
let s=initial(),last=performance.now();
const missions=['Reach the blue repair kit near the garage','Repair the vehicle beside the garage','Enter the car','Drive to the Taylor Street marker','Exit the vehicle','Talk to the NPC','Mission completed!'];
const repair={x:235,y:370},npc={x:822,y:170},dest={x:758,y:355};
function distance(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)}
function save(){try{localStorage.setItem('streetverse-baseline-v1',JSON.stringify(s))}catch{}}
function load(){try{const t=JSON.parse(localStorage.getItem('streetverse-baseline-v1'));if(t&&Number.isFinite(t.x)&&Number.isFinite(t.y)&&Number.isInteger(t.step)&&t.step>=0&&t.step<=6)s={...initial(),...t}}catch{}}
function near(x,y,r=62){return distance(s.x,s.y,x,y)<r}
function advance(){s.step++;s.xp+=25;save()}
function interact(){
 if(s.step===0&&near(repair.x,repair.y))advance();
 else if(s.step===1&&near(s.carX,s.carY))advance();
 else if(s.step===2&&near(s.carX,s.carY)){s.driving=true;s.x=s.carX;s.y=s.carY;advance()}
 else if(s.step===3&&near(dest.x,dest.y))advance();
 else if(s.step===4){s.driving=false;s.x=Math.min(W-20,s.x+45);advance()}
 else if(s.step===5&&near(npc.x,npc.y))advance();
 updateHud()
}
function updateHud(){hud.textContent='MISSION '+Math.min(s.step+1,6)+'/6: '+missions[s.step]+' • XP '+s.xp+(s.driving?' • Driving':' • On foot')}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#243b33';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#444951';ctx.fillRect(0,320,W,110);ctx.fillRect(680,0,140,H);
 ctx.strokeStyle='#dfce84';ctx.setLineDash([30,26]);ctx.beginPath();ctx.moveTo(0,375);ctx.lineTo(W,375);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#466075';ctx.fillRect(145,120,320,170);ctx.fillRect(505,75,150,155);
 ctx.fillStyle='#d9e9f4';ctx.font='bold 22px system-ui';ctx.fillText('OMNIGARAGE',190,170);ctx.fillText('CIRCLE PARK',475,485);ctx.fillText('TAYLOR ST',705,42);
 ctx.fillStyle='#40cce4';ctx.beginPath();ctx.arc(repair.x,repair.y,16,0,7);ctx.fill();
 ctx.fillStyle='#f5ce46';ctx.beginPath();ctx.arc(dest.x,dest.y,25,0,7);ctx.strokeStyle='#f5ce46';ctx.lineWidth=5;ctx.stroke();
 ctx.fillStyle='#f5d7bb';ctx.beginPath();ctx.arc(npc.x,npc.y,18,0,7);ctx.fill();ctx.font='16px system-ui';ctx.fillStyle='white';ctx.fillText('NPC',npc.x-17,npc.y-25);
 ctx.fillStyle='#a22e5c';ctx.fillRect(s.carX-36,s.carY-23,72,46);ctx.fillStyle='#d0e9ff';ctx.fillRect(s.carX-8,s.carY-18,22,36);
 if(!s.driving){ctx.fillStyle='#80a5fa';ctx.beginPath();ctx.arc(s.x,s.y,18,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText('BJ',s.x-9,s.y+5)}
 ctx.fillStyle='#fff';ctx.font='16px system-ui';ctx.fillText('Blue circle = repair kit  |  Gold ring = destination',18,28);
}
function move(dt){
 let x=Number(keys.has('right')||keys.has('d'))-Number(keys.has('left')||keys.has('a'));
 let y=Number(keys.has('down')||keys.has('s'))-Number(keys.has('up')||keys.has('w'));
 const pad=navigator.getGamepads?.()?.find(Boolean);
 if(pad){x+=Math.abs(pad.axes[0])>0.17?pad.axes[0]:0;y+=Math.abs(pad.axes[1])>0.17?pad.axes[1]:0}
 const m=Math.hypot(x,y);
 if(m>0){const speed=s.driving?230:155;s.x=Math.max(20,Math.min(W-20,s.x+x/m*speed*dt));s.y=Math.max(20,Math.min(H-20,s.y+y/m*speed*dt));if(s.driving){s.carX=s.x;s.carY=s.y}}
}
let prevGamepadAction=false;
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;move(dt);
 const pad=navigator.getGamepads?.()?.find(Boolean);const action=!!pad?.buttons?.[0]?.pressed;if(action&&!prevGamepadAction)interact();prevGamepadAction=action;
 draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k.replace('arrow',''));if(k==='e'&&!e.repeat)interact()});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase().replace('arrow','')));
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(k))}
document.querySelector('#interact').onclick=interact;
document.querySelector('#reset').onclick=()=>{s=initial();save();updateHud()};
window.addEventListener('blur',()=>keys.clear());
load();updateHud();requestAnimationFrame(loop);
})();
</script></html>
